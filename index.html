  // Returns [podIdx, slotIdx] of the first empty pod slot, or [-1,-1].
  function findFirstEmptyPodSlot() {
    for (let pi = 0; pi < 3; pi++) {
      for (let si = 0; si < 4; si++) {
        if (!G.pods[pi][si]) return [pi, si];
      }
    }
    return [-1, -1];
  }

  // Style icon inner paths (16×16 viewBox) per dominant tag.
  const _STYLE_PATHS = {
    power:      `<rect x="0.5" y="6.5" width="2" height="3" rx="0.5"/><rect x="2.5" y="5.5" width="1.5" height="5" rx="0.5"/><rect x="4" y="7.25" width="8" height="1.5" rx="0.75"/><rect x="12" y="5.5" width="1.5" height="5" rx="0.5"/><rect x="13.5" y="6.5" width="2" height="3" rx="0.5"/>`,
    accurate:   `<circle cx="8" cy="8" r="6.5" fill="none"/><circle cx="8" cy="8" r="3.5" fill="none"/><circle cx="8" cy="8" r="1.2"/>`,
    shortgame:  `<line x1="5" y1="2" x2="5" y2="14" stroke-linecap="round"/><polygon points="5,2 12,4.5 5,7"/><line x1="3" y1="14" x2="11" y2="14" stroke-linecap="round"/>`,
    clutch:     `<path d="M9.5 1.5 L6 8 H8.5 L6.5 14.5 L13 6.5 H10 Z"/>`,
  };
  const _STYLE_COLOR = { power:'#f97316', accurate:'#38bdf8', shortgame:'#4ade80', clutch:'#f59e0b' };

  // Render a style icon centred at (cx,cy) at given pixel size inside a parent SVG.
  function _styleIconEl(style, cx, cy, size=12) {
    const paths = _STYLE_PATHS[style] || '';
    const color = _STYLE_COLOR[style] || '#888';
    const sc = size / 16;
    return `<g transform="translate(${(cx - size/2).toFixed(1)},${(cy - size/2).toFixed(1)}) scale(${sc.toFixed(3)})" fill="${color}" stroke="${color}" stroke-width="${(1.4/sc).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">${paths}</g>`;
  }

  // Shield outline extracted directly from the official Ryder Cup crest vector
  // (outer silhouette layer), normalized to a 64×64 coordinate space: pointed
  // top, rounded shoulders, a nameplate ledge flaring to full width around
  // y=34, tapering to a point at the bottom. Not hand-traced — the numbers
  // come from the source SVG's path data, translated/scaled to this box.
  const SHIELD_OUTLINE = 'M57.85,33.32 c2.17,-10.38,0.42,-18.87,0.35,-19.23 l-0.06,-0.29 l-0.19,-0.23 c-0.09,-0.10,-2.24,-2.68,-6.50,-5.63 c-3.90,-2.72,-10.41,-6.28,-19.22,-7.90 l-0.22,-0.04 l-0.22,0.04 c-8.81,1.62,-15.31,5.18,-19.22,7.90 c-4.26,2.95,-6.42,5.53,-6.50,5.63 l-0.19,0.23 l-0.06,0.29 c-0.08,0.36,-1.82,8.85,0.35,19.23 l-6.15,1.01 l3.90,15.46 l10.77,1.71 c4.28,5.22,9.94,9.38,16.85,12.38 l0.49,0.22 l0.49,-0.22 c6.92,-3.01,12.58,-7.17,16.85,-12.38 l10.77,-1.71 L64.00,34.33 Z';
  const CHEM_DOT_COLOR = { green: '#22c55e', yellow: '#eab308', red: '#ef4444' };

  // Shield SVG for an empty pod slot placeholder (or the empty captain hub at a larger size).
  function _emptyShieldSVG(size = 60, label = '') {
    const labelText = label
      ? `<text x="32" y="36" text-anchor="middle" font-size="7" fill="rgba(201,168,76,.55)" font-weight="800" letter-spacing="0.08em" font-family="system-ui,sans-serif">${label}</text>`
      : '';
    return `<svg viewBox="0 0 64 64" width="${size}" height="${size}">
      <path d="${SHIELD_OUTLINE}" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.6" stroke-dasharray="5 3.5"/>
      ${labelText}
    </svg>`;
  }

  // Shield SVG shared by pod slots, draft tray cards, and the captain hub — same
  // shape/content for both players and captains. `chem` is { points, tier } from
  // computePlayerChemScore/computeCaptainChemScore (omit for tray cards, which
  // aren't placed in a pod yet). `size` overrides the rendered width/height
  // (viewBox stays fixed at 64x64) — used to render the captain hub 10% larger.
  function _shieldCardSVG(entity, isCaptain, chem, size = 60) {
    const tc = TIER_COLORS[entity.tier] || (isCaptain ? '#c9a84c' : '#888');
    const parts = entity.name.split(' ');
    const label = parts.length > 1
      ? `${parts[0][0]}. ${parts.slice(1).join(' ').toUpperCase()}`
      : entity.name.toUpperCase();
    const shortLabel = label.length > 12 ? label.slice(0, 11) + '…' : label;
    const yearLabel = isCaptain ? (entity.years || []).slice(0, 2).join('/') : String(entity.year);

    // Shirt/jacket icon is now the dominant central element (matching where the
    // trophy graphic sits on the real crest) — flag/trophy flank it lower down.
    const bodyIcon = isCaptain
      ? `<svg x="16" y="2" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="${tc}" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">${JACKET_PATH}${JACKET_TRIM}</svg>`
      : `<svg x="16" y="2" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="${tc}" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">${SHIRT_PATH}</svg>`;

    // Attribute icon overlays centered inside the shirt/jacket silhouette —
    // sized down further so it reads as an accent on the shirt, not a second
    // icon competing with it.
    const styleIcon = isCaptain ? '' : _styleIconEl(dominantStyleTag(entity), 32, 21, 12);

    // Played/won-cup icons sit at shoulder height, snug against the shirt's
    // own edges (rather than down near the hem) so they read as flanking the
    // shirt instead of floating separately near the nameplate.
    let indicators = '';
    if (!isCaptain && entity.made_team === true) {
      const won = CUP_RESULTS[String(entity.year)] === entity.nationality;
      indicators = `
        <svg x="8" y="14" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${FLAG_PATH}</svg>
        <svg x="48" y="14" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="${won ? '#c9a84c' : '#3a4a3a'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${TROPHY_PATH}</svg>`;
    }

    const chemBadge = chem
      ? `<circle cx="59" cy="6" r="6" fill="${CHEM_DOT_COLOR[chem.tier]}"/>
         <text x="59" y="8.7" text-anchor="middle" font-size="7" fill="#111" font-weight="800" font-family="system-ui,sans-serif">${chem.points}</text>`
      : '';

    return `<svg viewBox="0 0 64 64" width="${size}" height="${size}">
      <path d="${SHIELD_OUTLINE}" fill="${tc}22" stroke="${tc}" stroke-width="1.6" ${isCaptain ? 'stroke-dasharray="4 2.5"' : ''}/>
      ${indicators}
      ${bodyIcon}
      ${styleIcon}
      <rect x="7" y="35" width="50" height="11" rx="1" fill="rgba(0,0,0,.4)"/>
      <text x="32" y="43.5" text-anchor="middle" font-size="8.5" fill="white" font-family="system-ui,sans-serif" font-weight="700">${shortLabel}</text>
      <text x="32" y="56" text-anchor="middle" font-size="7.5" fill="white" font-weight="800" font-family="system-ui,sans-serif">${yearLabel}</text>
      ${chemBadge}
    </svg>`;
  }

  // HTML for one pod slot (filled or empty).
  function podSlotHTML(pi, si) {
    const p = G.pods[pi][si];
    if (!p) {
      return `<div class="pod-slot empty" data-pod="${pi}" data-slot="${si}">${_emptyShieldSVG()}</div>`;
    }
    const podmates = G.pods[pi].filter((x, i) => x && i !== si);
    const chem = computePlayerChemScore(p, podmates, [], CUP_RESULTS, G.captain, venueTopAttrs(G.venue, VENUES, 2));
    return `<div class="pod-slot filled" data-pod="${pi}" data-slot="${si}">${_shieldCardSVG(p, false, chem)}</div>`;
  }

  // HTML for the captain hub node — same shield shape as draft/pod cards, 10% larger.
  const HUB_SIZE = 66;
  function captainHubHTML() {
    const c = G.captain;
    if (!c) {
      return `<div class="captain-hub-node empty" id="captain-hub-node">${_emptyShieldSVG(HUB_SIZE, 'CAPT')}</div>`;
    }
    const allPlayers = G.pods.flat().filter(Boolean);
    const capChem = computeCaptainChemScore(c, allPlayers, [], G.venue, CUP_RESULTS);
    return `<div class="captain-hub-node filled" id="captain-hub-node">${_shieldCardSVG(c, true, capChem, HUB_SIZE)}</div>`;
  }

  // Full squad hub area HTML (SVG + 3 pods + captain hub).
  function squadHubHTML() {
    const podGroup = (pi, label) => `
      <div class="pod-group" data-pod-group="${pi}">
        <div class="pod-label">Pod ${label}</div>
        <div class="pod-slots">
          ${[0,1,2,3].map(si => podSlotHTML(pi, si)).join('')}
        </div>
      </div>`;
    return `<div class="squad-hub-area" id="squad-hub-area">
      <svg class="conn-svg" id="conn-svg"></svg>
      <div class="squad-hub-wrap">
        <div class="pod-row-top">${podGroup(0, 'A')}</div>
        <div class="pod-row-mid">${captainHubHTML()}</div>
        <div class="pod-row-bot">${podGroup(1, 'B')}${podGroup(2, 'C')}</div>
      </div>
    </div>`;
  }

  // Scales the whole pod cluster up to fill the leftover vertical space in
  // draft-team-area instead of sitting at a fixed size in a much taller flex
  // box (the "wasted space" on tall desktop windows). Drives the `--hub-scale`
  // CSS variable that every pod/hub size and offset is expressed in terms of
  // (see the .squad-hub-wrap rule) rather than a `transform: scale()` on the
  // wrap — that was tried first, but squad-hub-wrap's own box is `width:100%`
  // (mostly empty space around the centered content), so scaling the element
  // scaled that phantom box too and blew out the page's scrollWidth. Scaling
  // the underlying literals has no such phantom box to inflate. Runs on
  // mobile too (not just desktop) — availW naturally becomes the binding
  // constraint on a narrow phone, so this can't overflow the viewport; a
  // fixed mobile breakpoint size kept needing to be hand-bumped larger every
  // time the pod cards felt cramped, so let real available space drive it.
  function fitSquadHub() {
    const area = document.querySelector('.draft-team-area');
    const wrap = document.querySelector('.squad-hub-wrap');
    if (!area || !wrap) return;
    // Hidden for the whole reset-measure-rescale cycle below so the momentary
    // "natural size" state (scale forced to 1 just to measure it) never
    // actually paints. Without this, the card text would render correctly for
    // one frame at scale 1, then the browser would fail to repaint it cleanly
    // once --hub-scale changed again a moment later — names/years would flash
    // and vanish on every render (and reappear-then-vanish again on every
    // pod drag, since each drag triggers this same measure/rescale cycle).
    // try/finally guarantees visibility is restored even on an early return.
    wrap.style.visibility = 'hidden';
    try {
      wrap.style.setProperty('--hub-scale', '1');
      // Measure the real rendered union of the pod groups + hub at scale 1 —
      // wrap's own declared height (300px) is only a nominal approximation
      // (pods B/C's real content actually runs a bit past it), and its width
      // is 100% of the container (tells us nothing about the actual cluster
      // footprint), so neither is trustworthy as a "natural size" on its own.
      const groups = document.querySelectorAll('.pod-group, .captain-hub-node');
      if (!groups.length) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      groups.forEach(el => {
        const r = el.getBoundingClientRect();
        minX = Math.min(minX, r.left); maxX = Math.max(maxX, r.right);
        minY = Math.min(minY, r.top);  maxY = Math.max(maxY, r.bottom);
      });
      // The +34/+16 buffers exist for the desktop radial layout's divider
      // lines, which run ~10-20px past a pod's edge — mobile's triangle
      // layout skips those lines entirely (see isMobileStack in
      // updateConnectionLines), so that margin is just unused width/height
      // it's width-bound on a phone, so reclaiming it here is what actually
      // buys a visibly bigger scale, not just headroom nothing uses.
      const isMobile = window.innerWidth <= 480;
      const naturalW = (maxX - minX) + (isMobile ? 6  : 16);
      const naturalH = (maxY - minY) + (isMobile ? 12 : 34);
      if (!naturalW || !naturalH) return;
      const statRow = document.querySelector('.squad-stat-row');
      const availH  = area.clientHeight - (statRow ? statRow.offsetHeight : 0) - (isMobile ? 8 : 16);
      const availW  = area.clientWidth - (isMobile ? 8 : 16);
      const scale   = Math.max(Math.min(availH / naturalH, availW / naturalW, 2.2), 0.9);
      wrap.style.setProperty('--hub-scale', scale);
    } finally {
      wrap.style.visibility = '';
    }
  }

  // TEMP DIAGNOSTIC — chasing an intermittent bug report where a filled pod/captain
  // card's name or year text goes blank a moment after render (see git history /
  // conversation for context). Only logs when something actually looks wrong (empty
  // text or a hidden/zero-opacity text node), so it's silent in the normal case.
  // Remove once the root cause is found and fixed.
  function _diagnoseCardText(label) {
    const wrap = document.querySelector('.squad-hub-wrap');
    const hubScale = wrap ? getComputedStyle(wrap).getPropertyValue('--hub-scale') : 'n/a';
    document.querySelectorAll('.pod-slot.filled, .captain-hub-node.filled').forEach(el => {
      const texts = el.querySelectorAll('text');
      const nameEl = texts[0], yearEl = texts[1];
      if (!nameEl || !yearEl) return;
      const nameStyle = getComputedStyle(nameEl);
      const yearStyle = getComputedStyle(yearEl);
      const isBad = t => !t.textContent.trim();
      const isHidden = s => s.opacity === '0' || s.display === 'none' || s.visibility === 'hidden';
      if (isBad(nameEl) || isBad(yearEl) || isHidden(nameStyle) || isHidden(yearStyle)) {
        const who = el.dataset.pod !== undefined ? `pod=${el.dataset.pod} slot=${el.dataset.slot}` : 'captain';
        console.warn(`[card-text-bug] ${label} — ${who} nameText="${nameEl.textContent}" yearText="${yearEl.textContent}" ` +
          `nameOpacity=${nameStyle.opacity} yearOpacity=${yearStyle.opacity} hubScale=${hubScale}`);
      }
    });
  }

  // Redraws SVG connection lines after any pod state change.
  function updateConnectionLines() {
    const area = document.getElementById('squad-hub-area');
    const svg  = document.getElementById('conn-svg');
    if (!area || !svg) return;
    const aRect = area.getBoundingClientRect();
    svg.innerHTML = '';
    svg.setAttribute('width',  aRect.width);
    svg.setAttribute('height', aRect.height);

    function ctr(el) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - aRect.left, y: r.top + r.height / 2 - aRect.top };
    }
    function drawLine(c1, c2, stroke, dashed, width, opacity) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1', c1.x); el.setAttribute('y1', c1.y);
      el.setAttribute('x2', c2.x); el.setAttribute('y2', c2.y);
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', width || '1.5');
      el.setAttribute('stroke-linecap', 'round');
      el.setAttribute('opacity', opacity || '0.55');
      if (dashed) el.setAttribute('stroke-dasharray', '4 3');
      svg.appendChild(el);
    }
    // How far along ray (dx,dy) from `center` you must travel before clearing
    // rect's bounding box in that direction (corner projection, not straight-
    // line corner distance — a diagonal corner distance overshoots for a rect
    // that isn't directly on the ray). Shared by every "stop at the edge, not
    // the centre" line below: divider-to-hub, divider-to-pod, and card-to-card.
    function reachToEdge(rect, center, dx, dy) {
      const corners = [
        { x: rect.left - aRect.left,  y: rect.top - aRect.top },
        { x: rect.right - aRect.left, y: rect.top - aRect.top },
        { x: rect.left - aRect.left,  y: rect.bottom - aRect.top },
        { x: rect.right - aRect.left, y: rect.bottom - aRect.top },
      ];
      return Math.max(...corners.map(c => (c.x - center.x) * dx + (c.y - center.y) * dy));
    }
    // Proper ray/box slab intersection — returns the {enter, exit} distances
    // (from `center`, along unit direction dx,dy) where the ray crosses rect,
    // or null if it never does. Unlike reachToEdge (which only bounds the
    // box's farthest extent along the ray, guaranteeing an endpoint clears it)
    // this tells us whether the ray's PATH actually clips through the box —
    // needed because a box that isn't centred on the ray can still get clipped
    // partway along a segment whose endpoint is legitimately past it.
    function rayBoxHit(rect, center, dx, dy) {
      const left = rect.left - aRect.left, right = rect.right - aRect.left;
      const top = rect.top - aRect.top, bottom = rect.bottom - aRect.top;
      let tmin = -Infinity, tmax = Infinity;
      if (Math.abs(dx) < 1e-9) {
        if (center.x < left || center.x > right) return null;
      } else {
        let t1 = (left - center.x) / dx, t2 = (right - center.x) / dx;
        if (t1 > t2) [t1, t2] = [t2, t1];
        tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
      }
      if (Math.abs(dy) < 1e-9) {
        if (center.y < top || center.y > bottom) return null;
      } else {
        let t1 = (top - center.y) / dy, t2 = (bottom - center.y) / dy;
        if (t1 > t2) [t1, t2] = [t2, t1];
        tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
      }
      if (tmax < tmin || tmax < 0) return null;
      return { enter: tmin, exit: tmax };
    }
    // Point on el's own bounding-box edge, along the ray from el's centre
    // toward `towardPoint` — i.e. where a line from el to towardPoint should
    // actually start/end so it never overlaps el's own card art.
    function edgePoint(el, towardPoint) {
      const r = el.getBoundingClientRect();
      const c = { x: r.left + r.width / 2 - aRect.left, y: r.top + r.height / 2 - aRect.top };
      const dist = Math.hypot(towardPoint.x - c.x, towardPoint.y - c.y);
      if (dist === 0) return c;
      const dx = (towardPoint.x - c.x) / dist, dy = (towardPoint.y - c.y) / dist;
      const reach = reachToEdge(r, c, dx, dy);
      return { x: c.x + dx * reach, y: c.y + dy * reach };
    }
    // Edge-to-edge line between two elements — never passes through either
    // element's own art, only the gap between them.
    function drawEdgeLine(el1, el2, stroke, dashed, width, opacity) {
      const c1 = ctr(el1), c2 = ctr(el2);
      drawLine(edgePoint(el1, c2), edgePoint(el2, c1), stroke, dashed, width, opacity);
    }

    // Structural divider lines — always visible, radiate from the captain hub's
    // edge (not its centre, so they never cut across the hub shield itself).
    // Upper-left separates Pod A / Pod B; upper-right A / C; straight down B / C.
    // Direction is the true angular bisector between each pair of pods' actual
    // rendered positions (not a fixed 60°-from-vertical constant) — a fixed
    // angle only matches the pod layout it was tuned against, and drifts out
    // of alignment (cutting across a pod's cards instead of skirting them)
    // the moment pod positions change. Length is measured from the actual
    // rendered pod clusters it borders, so it stops just outside their edge.
    // Mobile uses a stacked layout (captain left, Pod A/B/C stacked in a
    // column to the right — see the max-width:480px media query) instead of
    // the desktop radial triangle. The angle-based divider/captain lines
    // below are meaningless for a linear stack (there's no "between two
    // pods" wedge to bisect), so they're skipped there; the within-pod
    // connector lines still apply to any layout, since they're just edge-to-
    // edge between a pod's own 4 slots wherever it's rendered.
    const isMobileStack = window.innerWidth <= 480;
    const capHub = document.getElementById('captain-hub-node');
    if (capHub && !isMobileStack) {
      const hubRect = capHub.getBoundingClientRect();
      const cc = ctr(capHub);
      const DIVIDER_MARGIN = 10;

      function podAngle(pi) {
        const c = ctr(document.querySelector(`[data-pod-group="${pi}"]`));
        return Math.atan2(c.y - cc.y, c.x - cc.x);
      }
      // Angle exactly between a1 and a2, taken the short way around.
      function bisect(a1, a2) {
        let diff = a2 - a1;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        return a1 + diff / 2;
      }
      function podReach(pi, dx, dy) {
        const el = document.querySelector(`[data-pod-group="${pi}"]`);
        if (!el) return 0;
        return reachToEdge(el.getBoundingClientRect(), cc, dx, dy);
      }

      const angleA = podAngle(0), angleB = podAngle(1), angleC = podAngle(2);
      [
        { angle: bisect(angleA, angleB), pods: [0, 1] }, // A / B
        { angle: bisect(angleA, angleC), pods: [0, 2] }, // A / C
        { angle: bisect(angleB, angleC), pods: [1, 2] }, // B / C
      ].forEach(({ angle, pods: [pi1, pi2] }) => {
        const dx = Math.cos(angle), dy = Math.sin(angle);
        let start = reachToEdge(hubRect, cc, dx, dy);
        const end = Math.max(podReach(pi1, dx, dy), podReach(pi2, dx, dy)) + DIVIDER_MARGIN;
        // If the ray actually clips through either pod's box before reaching
        // the endpoint (not just failing to clear its farthest corner — the
        // two aren't the same thing for a box that's off to one side of the
        // ray), push the start point past that box's exit instead of through it.
        [pi1, pi2].forEach(pi => {
          const el = document.querySelector(`[data-pod-group="${pi}"]`);
          if (!el) return;
          const hit = rayBoxHit(el.getBoundingClientRect(), cc, dx, dy);
          if (hit && hit.exit < end - 1) start = Math.max(start, hit.exit + 2.5);
        });
        drawLine(
          { x: cc.x + dx * start, y: cc.y + dy * start },
          { x: cc.x + dx * end, y: cc.y + dy * end },
          '#7a6520', false, '2.5', '0.75'
        );
      });
    }

    // Connector lines within each pod — every pair of the 4 slots (a box plus
    // both diagonals), edge-to-edge so they run in the gaps between cards
    // rather than passing behind them. Drawn faint white as placeholders even
    // before both slots are filled, so the relationship grid reads immediately.
    G.pods.forEach((pod, pi) => {
      for (let i = 0; i < 4; i++) {
        for (let j = i + 1; j < 4; j++) {
          const el1 = document.querySelector(`[data-pod="${pi}"][data-slot="${i}"]`);
          const el2 = document.querySelector(`[data-pod="${pi}"][data-slot="${j}"]`);
          if (!el1 || !el2) continue;
          if (!pod[i] || !pod[j]) {
            drawEdgeLine(el1, el2, '#ffffff', false, '1', '0.15');
            continue;
          }
          const chem = computeChemistry(pod[i], pod[j], [], CUP_RESULTS);
          const stroke = chem >= 2 ? '#22c55e' : chem >= 1 ? '#eab308' : '#ef4444';
          drawEdgeLine(el1, el2, stroke, false, '1.5', '0.6');
        }
      }
    });

    // Captain-to-pod group lines (gold dashed) — only once captain selected
    if (G.captain && capHub && !isMobileStack) {
      [0, 1, 2].forEach(pi => {
        const podEl = document.querySelector(`[data-pod-group="${pi}"]`);
        if (!podEl) return;
        drawEdgeLine(capHub, podEl, '#c9a84c', true, '1.5', '0.5');
      });
    }
  }
  // Redraw on resize/orientation change so divider lines stay pinned to the
  // pod clusters instead of the coordinates computed at a since-changed width.
  window.addEventListener('resize', () => { if (document.getElementById('squad-hub-area')) { fitSquadHub(); updateConnectionLines(); } });

  // ─────────────────────────────────────────────────────────────────────────────
  // DRAG-AND-DROP SYSTEM
  // ─────────────────────────────────────────────────────────────────────────────
  let _drag = null; // { card, isCapt, source: {type,pi,si}, ghost, sourceEl }

  function _startDrag(e, card, source, sourceEl) {
    e.preventDefault();
    const isCapt = isCaptainCard(card);
    const ghost  = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.innerHTML  = _shieldCardSVG(card, isCapt, null, 58);
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
    document.body.appendChild(ghost);
    sourceEl.style.opacity = '0.3';
    _drag = { card, isCapt, source, ghost, sourceEl };
    try { sourceEl.setPointerCapture(e.pointerId); } catch(_) {}
  }

  function _moveGhost(e) {
    if (!_drag) return;
    e.preventDefault();
    _drag.ghost.style.left = e.clientX + 'px';
    _drag.ghost.style.top  = e.clientY + 'px';
    // Highlight valid drop targets
    document.querySelectorAll('.pod-slot.drop-ok, .captain-hub-node.drop-ok').forEach(el => el.classList.remove('drop-ok'));
    if (_drag.isCapt) {
      document.getElementById('captain-hub-node')?.classList.add('drop-ok');
    } else {
      document.querySelectorAll('.pod-slot').forEach(el => el.classList.add('drop-ok'));
    }
  }

  function _endDrag(e) {
    if (!_drag) return;
    _drag.ghost.style.pointerEvents = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    _drag.ghost.remove();
    document.querySelectorAll('.pod-slot.drop-ok, .captain-hub-node.drop-ok').forEach(el => el.classList.remove('drop-ok'));

    const slotEl = under?.closest('[data-pod][data-slot]');
    const hubEl  = under?.closest('#captain-hub-node');

    if (_drag.isCapt && hubEl) {
      _dropOnHub();
    } else if (!_drag.isCapt && slotEl) {
      _dropOnSlot(parseInt(slotEl.dataset.pod), parseInt(slotEl.dataset.slot));
    } else {
      // Invalid drop — restore source opacity
      if (_drag.sourceEl) _drag.sourceEl.style.opacity = '';
      _drag = null;
    }
  }

  function _dropOnHub() {
    const { card, source } = _drag;
    _drag = null;
    G.captain = card;
    if (source.type === 'tray') {
      _advanceDraft(card, true);
    } else {
      save(); render();
    }
  }

  function _dropOnSlot(pi, si) {
    const { card, source } = _drag;
    _drag = null;
    const existing = G.pods[pi][si];

    if (source.type === 'tray') {
      G.pods[pi][si] = card;
      G.picks.push(card);
      if (existing) {
        const [fp, fs] = findFirstEmptyPodSlot();
        if (fp >= 0) G.pods[fp][fs] = existing;
      }
      _advanceDraft(card, false);
    } else {
      // Rearrange: swap source slot with target slot
      G.pods[pi][si] = card;
      G.pods[source.pi][source.si] = existing; // existing may be null
      save(); render();
    }
  }

  // Advances draft after a pick: runs the AI's parallel pick, then stays on the
  // draft screen with a "Next Selection" prompt instead of a dedicated reveal
  // screen (the pod board itself is the reveal — no need to leave it).
  function _advanceDraft(item, captainPicked) {
    G.lastPick          = item;
    G.lastPickIsCaptain = captainPicked;
    const aiIsDone = (G.aiPicks.length === 12 && G.aiCaptain !== null);
    if (!aiIsDone) {
      const aiCards = generateRoundCardsFor(opp(G.side), G.aiPicks, G.aiCaptain, G.aiSeenNames);
      const aiPick  = aiBestFromCards(aiCards, G.aiPicks);
      G.aiRoundPick = aiPick;
      if (aiPick) {
        if (isCaptainCard(aiPick)) { G.aiCaptain = aiPick; } else { G.aiPicks.push(aiPick); }
      }
    } else {
      G.aiRoundPick = null;
    }
    G.awaitingNext = true;
    save(); render();
  }

  // "Next Selection" button handler — advances to the next round's tray once
  // the user has reviewed their pick and the pod board.
  function advanceToNextRound() {
    G.awaitingNext = false;
    G.currentRound = G.currentRound + 1;
    G.currentCards = nextRoundCards();
    save(); render();
  }

  // Initialise the document-level drag listeners once.
  (function initDrag() {
    document.addEventListener('pointermove', _moveGhost, { passive: false });
    document.addEventListener('pointerup',   _endDrag);
    document.addEventListener('pointercancel', () => {
      if (_drag) { _drag.ghost?.remove(); if (_drag.sourceEl) _drag.sourceEl.style.opacity = ''; _drag = null; }
    });
    // Suppress context-menu on long-press (mobile Safari/Chrome) so drag starts immediately.
    document.addEventListener('contextmenu', e => { if (_drag) e.preventDefault(); });
    // Delegate pointerdown from body so re-renders don't break listeners.
    document.body.addEventListener('pointerdown', e => {
      const trayCard = e.target.closest('.tray-card');
      const podSlot  = e.target.closest('.pod-slot.filled');
      if (trayCard) {
        const pid = trayCard.dataset.pid, cid = trayCard.dataset.cid;
        const card = pid ? PLAYERS.find(p => p.id === pid) : CAPTAINS.find(c => c.id === cid);
        if (card) _startDrag(e, card, { type: 'tray' }, trayCard);
      } else if (podSlot) {
        const pi = parseInt(podSlot.dataset.pod), si = parseInt(podSlot.dataset.slot);
        const card = G.pods[pi]?.[si];
        if (card) _startDrag(e, card, { type: 'pod', pi, si }, podSlot);
      }
    });
  })();

  // Shield SVG for a player card in the draft tray (no chem dot — not yet placed).
  function _trayShieldHTML(player) {
    return _shieldCardSVG(player, false, null);
  }

  // Shield SVG for a captain card in the draft tray.
  function _trayCaptainShieldHTML(captain) {
    return _shieldCardSVG(captain, true, null);
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: DRAFT
  // ─────────────────────────────────────────────────────────────────────────────
  function renderDraft() {
    const round         = G.currentRound;
    const cards         = G.currentCards;
    const draftComplete = G.picks.length === 12 && G.captain !== null;

    // Running Talent + Chem numbers — captain's tier counts toward Talent too
    const talent = G.picks.reduce((s, p) => s + getTalentScore(p.tier, TALENT_SCORES), 0)
      + (G.captain ? getTalentScore(G.captain.tier, TALENT_SCORES) : 0);
    const chem   = computeTeamChemScore(G.pods, G.captain, G.venue, CUP_RESULTS, VENUES);

    let bottomHTML;
    if (draftComplete) {
      bottomHTML = `<div class="pod-submit-bar">
        <div style="font-size:10px;color:var(--text-muted)">Rearrange pods to optimize chemistry, then submit</div>
        <button class="btn btn-gold" id="submit-pairings-btn" style="width:100%;max-width:320px">Submit to Pairings →</button>
      </div>`;
    } else if (G.awaitingNext) {
      const aiIsDone = (G.aiPicks.length === 12 && G.aiCaptain !== null);
      const aiLine   = G.aiRoundPick
        ? `Opponent picked <strong>${G.aiRoundPick.name}</strong>`
        : (aiIsDone ? 'Opponent\'s squad is complete' : '');
      const nextIsCaptainRound = (G.picks.length === 12 && G.captain === null);
      bottomHTML = `<div class="pod-submit-bar">
        <div style="font-size:11px;color:var(--text)">You picked <strong>${G.lastPick.name}</strong></div>
        ${aiLine ? `<div style="font-size:10px;color:var(--text-muted)">${aiLine}</div>` : ''}
        <button class="btn btn-gold" id="next-selection-btn" style="width:100%;max-width:320px">
          ${nextIsCaptainRound ? 'Choose Your Captain →' : 'Next Selection →'}
        </button>
      </div>`;
    } else {
      const roundLabel = (G.picks.length === 12 && G.captain === null)
        ? 'Round 13 — Choose Your Captain'
        : `Round ${round} of 13 — Drag a card to a pod slot`;
      const trayHTML = cards.map(c => {
        const isCapt = isCaptainCard(c);
        const html   = isCapt ? _trayCaptainShieldHTML(c) : _trayShieldHTML(c);
        const attr   = isCapt ? `data-cid="${c.id}"` : `data-pid="${c.id}"`;
        return `<div class="tray-card" ${attr}>${html}</div>`;
      }).join('');
      bottomHTML = `<div class="pick-area">
        <div class="pick-round-label">${roundLabel}</div>
        <div class="pick-cards-row">${trayHTML}</div>
      </div>`;
    }

    document.getElementById('app').innerHTML = `
      <div class="draft-full">
        <div class="page-header">
          <span class="page-title">Fourballs</span>
          <span class="ticker-score">Round ${Math.min(round, 13)} of 13</span>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:var(--text-dim)">${G.side}</span>
        </div>
        ${courseProfileHTML(G.venue, G.captain)}
        <div class="draft-team-area">
          <div class="squad-stat-row">
            <span><span class="ssn-label">Talent</span> <span class="ssn-val">${talent}</span></span>
            <span><span class="ssn-label">Chem</span> <span class="ssn-val">${chem}</span></span>
            <span class="ssn-total"><span class="ssn-label">Total</span> <span class="ssn-val">${talent + chem}</span></span>
            <span style="flex:1"></span>
            <span style="font-size:9px;color:var(--text-dim)">${G.picks.length}/12</span>
          </div>
          ${squadHubHTML()}
        </div>
        ${bottomHTML}
      </div>`;

    if (draftComplete) {
      document.getElementById('submit-pairings-btn').addEventListener('click', submitToPairings);
    } else if (G.awaitingNext) {
      document.getElementById('next-selection-btn').addEventListener('click', advanceToNextRound);
    }
    requestAnimationFrame(() => { fitSquadHub(); updateConnectionLines(); });
    // TEMP DIAGNOSTIC — checked at a few delays to catch a "fine at first, then
    // goes blank a moment later" pattern. See _diagnoseCardText.
    _diagnoseCardText('render:0ms');
    [300, 1000, 2500].forEach(ms => setTimeout(() => _diagnoseCardText(`render:${ms}ms`), ms));
  }

  // handlePick retained for Advanced Mode and any legacy code paths; pod builder
  // uses _advanceDraft directly after pod placement via drag-and-drop.
  function handlePick(item) {
    const captainPicked = isCaptainCard(item);
    if (captainPicked) { G.captain = item; } else { G.picks.push(item); }
    _advanceDraft(item, captainPicked);
  }

  function submitToPairings() {
    G.pairingOptions = computePairingOptions(G.picks, 4, G.pods);
    G.pairingIndex   = 0;
    G.pairings       = G.pairingOptions[0];
    const aiOpts = computePairingOptions(G.aiPicks, 1, null);
    G.aiPairings = aiOpts[0] || { fridayAM: [], fridayPM: [], saturdayAM: [], saturdayPM: [] };
    G.phase = 'review';
    save();
    if (G.mode === 'advanced') { renderAdvancedPairing(); } else { render(); }
  }


  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: ADVANCED PAIRING (manual pair selection — all 4 sessions)
  // ─────────────────────────────────────────────────────────────────────────────
  function renderAdvancedPairing() {
    const app   = document.getElementById('app');
    const picks = G.picks.filter(Boolean);

    const SESS_META = {
      friAM: { label: 'Friday — Foursomes',  sub: 'Alternating shots · accuracy &amp; consistency win', fmt: 'foursomes', key: 'fridayAM'   },
      satAM: { label: 'Saturday — Foursomes', sub: 'Alternating shots · accuracy &amp; consistency win', fmt: 'foursomes', key: 'saturdayAM' },
      friPM: { label: 'Friday — Fourball',   sub: 'Best ball · aggression &amp; birdie rate win',       fmt: 'fourball',  key: 'fridayPM'   },
      satPM: { label: 'Saturday — Fourball', sub: 'Best ball · aggression &amp; birdie rate win',       fmt: 'fourball',  key: 'saturdayPM' }
    };
    const SESS_ORDER = ['friAM', 'satAM', 'friPM', 'satPM'];

    // Pre-fill from existing pairings (all 4 sessions)
    function srcPairs(key) {
      const arr = G.pairings[key];
      if (arr && arr.length) return arr.map(([a,b]) => [a||null, b||null]);
      const opt = G.pairingOptions[0];
      return opt && opt[key] ? opt[key].map(([a,b]) => [a||null, b||null]) : [[null,null],[null,null],[null,null],[null,null]];
    }

    const slots = {
      friAM: srcPairs('fridayAM'),
      satAM: srcPairs('saturdayAM'),
      friPM: srcPairs('fridayPM'),
      satPM: srcPairs('saturdayPM')
    };

    // Count how many of the 4 sessions this player appears in (max 4 = fatigued)
    function playerSessions(p) {
      return SESS_ORDER.filter(s => slots[s].some(([a,b]) => (a&&a.id===p.id)||(b&&b.id===p.id))).length;
    }

    function isComplete() {
      return SESS_ORDER.every(s => slots[s].every(([a,b]) => a && b));
    }

    function chemDisplay(p1, p2) {
      if (!p1 || !p2) return '<span style="font-size:11px;color:var(--text-dim);">—</span>';
      const score = computeChemistry(p1, p2, PLAYERS, CUP_RESULTS);
      return `<span class="chem-dot ${chemClass(score)}" style="flex-shrink:0;"></span>
              <span style="font-size:13px;color:var(--text-muted);margin-left:4px;">${score}</span>`;
    }

    function slotHTML(sess, pi, si) {
      const p = slots[sess][pi][si];
      if (p) {
        const tc    = TIER_COLORS[p.tier] || '#555';
        const tired = playerSessions(p) >= 4;
        return `<div class="adv-slot filled" data-sess="${sess}" data-pi="${pi}" data-si="${si}"
                     style="border-color:${tc}55;background:${tc}15;">
                  <span class="adv-slot-name">${p.name}</span>
                  ${tired ? '<span title="Fatigued in singles" style="font-size:10px;color:var(--gold);">⚡</span>' : ''}
                  <span class="adv-slot-x" data-sess="${sess}" data-pi="${pi}" data-si="${si}">×</span>
                </div>`;
      }
      return `<div class="adv-slot empty" data-sess="${sess}" data-pi="${pi}" data-si="${si}">Pick +</div>`;
    }

    function pairRowHTML(sess, pi) {
      const [p1,p2] = slots[sess][pi];
      const fmt     = SESS_META[sess].fmt;
      return `<div class="adv-pair-row">
        <span class="adv-pair-num">${pi+1}</span>
        ${slotHTML(sess,pi,0)}
        <span class="adv-plus">+</span>
        ${slotHTML(sess,pi,1)}
        <div class="adv-chem">${chemDisplay(p1,p2)}</div>
      </div>`;
    }

    function boardHTML() {
      return SESS_ORDER.map(sess => {
        const { label, sub } = SESS_META[sess];
        return `<div class="adv-section">
          <div class="adv-sect-title">${label}</div>
          <div class="adv-sect-sub">${sub}</div>
          ${[0,1,2,3].map(i => pairRowHTML(sess,i)).join('')}
        </div>`;
      }).join('') +
      `<div style="margin-top:4px;font-size:11px;color:var(--text-dim);text-align:center;padding-bottom:8px;">
        Players in all 4 sessions are fatigued in singles &nbsp;·&nbsp; <span style="color:var(--gold);">⚡</span> = fatigued
      </div>`;
    }

    function pickerHTML(sess, pi, si) {
      const partner  = slots[sess][pi][1-si];
      const current  = slots[sess][pi][si];
      const fmt      = SESS_META[sess].fmt;
      return `
        <div class="adv-overlay" id="adv-overlay">
          <div class="adv-modal">
            <div class="adv-modal-title">${partner ? `Paired with ${partner.name}` : 'Select a player'}</div>
            <div class="adv-modal-grid">
              ${picks.map(p => {
                const isPartner   = partner && partner.id === p.id;
                const isCurrent   = current && current.id === p.id;
                const chem        = partner ? computeChemistry(partner, p, PLAYERS, CUP_RESULTS) : null;
                const chemCls     = chem !== null ? chemClass(chem) : '';
                const sessCount   = playerSessions(p);
                const alreadySess = slots[sess].some(([a,b]) => (a&&a.id===p.id)||(b&&b.id===p.id));
                const wouldTire   = !isCurrent && !alreadySess && sessCount + 1 >= 4;
                return `<div class="adv-pick-card" data-pid="${p.id}"
                             style="${isPartner ? 'opacity:.3;pointer-events:none;' : ''}${isCurrent ? 'border-color:var(--gold);background:rgba(201,168,76,.12);' : ''}">
                  <div style="font-size:12px;font-weight:700;color:var(--text);">${p.name}</div>
                  <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;">${p.year}</div>
                  ${chem!==null ? `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">
                    <span class="chem-dot ${chemCls}" style="width:7px;height:7px;flex-shrink:0;"></span>
                    <span style="font-size:13px;color:var(--text-muted);">${chem}</span>
                  </div>` : ''}
                  ${wouldTire ? '<div style="font-size:9px;color:var(--gold);margin-top:3px;">⚡ Tired</div>' : ''}
                </div>`;
              }).join('')}
            </div>
            <button class="btn btn-outline" id="adv-cancel" style="width:100%;margin-top:14px;font-size:13px;">Cancel</button>
          </div>
        </div>`;
    }

    function redraw() {
      document.getElementById('adv-board').innerHTML = boardHTML();
      const btn = document.getElementById('adv-confirm');
      if (btn) btn.disabled = !isComplete();
      attachEvents();
    }

    function attachEvents() {
      document.querySelectorAll('.adv-slot.empty').forEach(el => {
        el.addEventListener('click', () => openPicker(el.dataset.sess, +el.dataset.pi, +el.dataset.si));
      });
      document.querySelectorAll('.adv-slot.filled').forEach(el => {
        el.addEventListener('click', e => {
          if (!e.target.classList.contains('adv-slot-x'))
            openPicker(el.dataset.sess, +el.dataset.pi, +el.dataset.si);
        });
      });
      document.querySelectorAll('.adv-slot-x').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          slots[el.dataset.sess][+el.dataset.pi][+el.dataset.si] = null;
          redraw();
        });
      });
    }

    function openPicker(sess, pi, si) {
      const wrap = document.getElementById('adv-picker-wrap');
      wrap.innerHTML = pickerHTML(sess, pi, si);
      document.getElementById('adv-cancel').addEventListener('click', () => { wrap.innerHTML = ''; });
      document.getElementById('adv-overlay').addEventListener('click', e => {
        if (e.target.id === 'adv-overlay') wrap.innerHTML = '';
      });
      document.querySelectorAll('.adv-pick-card').forEach(card => {
        card.addEventListener('click', () => {
          if (card.style.pointerEvents === 'none') return;
          const p = picks.find(pl => pl.id === card.dataset.pid);
          if (p) {
            slots[sess][pi][si] = p;
            wrap.innerHTML = '';
            redraw();
          }
        });
      });
    }

    function confirmPairings() {
      const allPairs = SESS_ORDER.flatMap(s => slots[s]);
      const appearances = {};
      for (const [p1,p2] of allPairs) {
        if (p1) appearances[p1.id] = (appearances[p1.id]||0) + 1;
        if (p2) appearances[p2.id] = (appearances[p2.id]||0) + 1;
      }
      const fatiguedIds = picks.filter(p => (appearances[p.id]||0) >= 4).map(p => p.id);

      G.pairings      = {
        fridayAM:   slots.friAM.map(([a,b]) => [a,b]),
        saturdayAM: slots.satAM.map(([a,b]) => [a,b]),
        fridayPM:   slots.friPM.map(([a,b]) => [a,b]),
        saturdayPM: slots.satPM.map(([a,b]) => [a,b]),
        _fatiguedIds: fatiguedIds
      };
      G.pairingOptions = [G.pairings];
      G.pairingIndex   = 0;
      save();
      renderReview();
    }

    app.innerHTML = `
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <div class="page-header">
          <span class="page-title">Fourballs</span>
          <span style="flex:1"></span>
          <span style="font-size:12px;color:var(--text-muted)">${G.venue.name}</span>
        </div>
        <div style="padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div>
            <div style="font-size:14px;font-weight:700;">Set Your Pairings</div>
            <div style="font-size:11px;color:var(--text-dim);">Pick all 16 pairs across 4 sessions</div>
          </div>
          <button class="btn btn-gold" id="adv-confirm" style="padding:9px 18px;font-size:14px;" ${isComplete()?'':'disabled'}>Confirm →</button>
        </div>
        <div style="flex:1;overflow-y:auto;padding:12px 14px 40px;">
          <div id="adv-board">${boardHTML()}</div>
        </div>
      </div>
      <div id="adv-picker-wrap"></div>`;

    attachEvents();
    document.getElementById('adv-confirm').addEventListener('click', confirmPairings);
  }

  // SCREEN: REVIEW
  // ─────────────────────────────────────────────────────────────────────────────
  function renderReview() {
    const app = document.getElementById('app');

    function pairListHTML(pairs) {
      if (!pairs || !pairs.length) return `<div style="font-size:11px;color:var(--text-dim);padding:4px 0;">No pairs assigned</div>`;
      return pairs.map((pair, i) => {
        const [p1, p2] = pair;
        if (!p1 && !p2) return `<div class="chem-pair" style="opacity:.4"><span class="cp-names">Pair ${i+1} — empty</span></div>`;
        if (p1 && p2) {
          const score = computeChemistry(p1, p2, PLAYERS, CUP_RESULTS);
          return `<div class="chem-pair">
            <span class="chem-dot ${chemClass(score)}"></span>
            <span class="cp-names">${p1.name} + ${p2.name}</span>
            <span style="font-size:13px;color:var(--text-muted)">${score}</span>
          </div>`;
        }
        const only = p1 || p2;
        return `<div class="chem-pair"><span class="cp-names">${only ? only.name : '—'} + (incomplete)</span></div>`;
      }).join('');
    }

    function teamColHTML(pairings, captain, title) {
      return `<div class="review-col-title">${title}</div>
        ${captain ? `<div class="captain-summary" style="margin-bottom:12px;">
          <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Captain</div>
          <div style="font-weight:700">${captain.name}</div>
          <div style="font-size:11px;color:var(--text-muted)">${(captain.years || []).join(', ')}</div>
        </div>` : ''}
        <div class="review-slot-group">
          <div class="review-slot-label">Friday AM — Foursomes</div>
          ${pairListHTML(pairings.fridayAM)}
        </div>
        <div class="review-slot-group">
          <div class="review-slot-label">Friday PM — Fourball</div>
          ${pairListHTML(pairings.fridayPM)}
        </div>
        <div class="review-slot-group">
          <div class="review-slot-label">Saturday AM — Foursomes</div>
          ${pairListHTML(pairings.saturdayAM)}
        </div>
        <div class="review-slot-group">
          <div class="review-slot-label">Saturday PM — Fourball</div>
          ${pairListHTML(pairings.saturdayPM)}
        </div>`;
    }

    // Fatigued players (platinum with 4 team appearances) + capacity error handling
    const fatiguedIds   = new Set(G.pairings._fatiguedIds || []);
    const fatiguedNames = G.picks.filter(p => fatiguedIds.has(p.id)).map(p => p.name);
    const optCount      = (G.pairingOptions || []).length;
    const optLabel      = optCount > 1 ? `Option ${(G.pairingIndex || 0) + 1} of ${optCount}` : '';
    const hasCapErr     = !G.pairings.fridayAM || G.pairings.fridayAM.length === 0;

    const fatiguedList = fatiguedNames.length > 1
      ? fatiguedNames.slice(0, -1).join(', ') + ' and ' + fatiguedNames[fatiguedNames.length - 1]
      : fatiguedNames[0] || '';
    const fatigueWarning = fatiguedNames.length ? `
      <div style="padding:6px 14px;background:rgba(201,168,76,.08);border-bottom:1px solid rgba(201,168,76,.2);font-size:11px;">
        <span style="color:var(--gold);font-weight:700;">⚠ Fatigue: </span>
        <span style="color:var(--text-muted)">${fatiguedList} ${fatiguedNames.length === 1 ? 'is' : 'are'} fatigued heading into Sunday singles.</span>
      </div>` : '';

    const capError = hasCapErr ? `
      <div style="padding:10px 14px;background:rgba(229,57,53,.1);border-bottom:1px solid rgba(229,57,53,.3);font-size:12px;color:#ef9a9a;">
        ⚠ Roster lacks the tier depth to fill all 16 team match slots. Consider reshuffling or accepting a lighter schedule.
      </div>` : '';

    app.innerHTML = `
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <div class="page-header">
          <span class="page-title">Fourballs</span>
          <span style="flex:1"></span>
          <span style="font-size:12px;color:var(--text-muted)">${G.venue.name}</span>
        </div>
        <div style="padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-gold" id="sim-btn" style="font-size:15px;padding:10px 22px;">Simulate The Cup →</button>
          <div style="display:flex;align-items:center;gap:8px;">
            ${G.mode === 'advanced'
              ? `<button class="btn btn-outline" id="rerandom-btn" style="font-size:12px;padding:6px 14px;">Edit Pairings</button>`
              : `${optLabel ? `<span style="font-size:10px;color:var(--text-dim)">${optLabel}</span>` : ''}
                 <button class="btn btn-outline" id="rerandom-btn" style="font-size:12px;padding:6px 14px;">Reshuffle Pairings</button>`
            }
          </div>
        </div>
        ${capError}
        ${fatigueWarning}
        <div class="review-layout">
          <div class="review-col">${teamColHTML(G.pairings, G.captain, 'Your Team (' + G.side + ')')}</div>
          <div class="review-col">${teamColHTML(G.aiPairings, G.aiCaptain, 'Opponent (' + opp(G.side) + ')')}</div>
        </div>
      </div>`;

    document.getElementById('rerandom-btn').addEventListener('click', () => {
      if (G.mode === 'advanced') {
        renderAdvancedPairing();
      } else {
        const opts = G.pairingOptions || [];
        if (opts.length > 1) {
          G.pairingIndex = ((G.pairingIndex || 0) + 1) % opts.length;
          G.pairings = opts[G.pairingIndex];
        }
        save();
        renderReview();
      }
    });

    document.getElementById('sim-btn').addEventListener('click', () => {
      try {
        const myTeam = {
          fridayAMPairs:   G.pairings.fridayAM,
          fridayPMPairs:   G.pairings.fridayPM,
          saturdayAMPairs: G.pairings.saturdayAM,
          saturdayPMPairs: G.pairings.saturdayPM,
          allPlayers:      G.picks
        };
        const aiTeam = {
          fridayAMPairs:   G.aiPairings.fridayAM,
          fridayPMPairs:   G.aiPairings.fridayPM,
          saturdayAMPairs: G.aiPairings.saturdayAM,
          saturdayPMPairs: G.aiPairings.saturdayPM,
          allPlayers:      G.aiPicks
        };
        G.results = simulateFullEvent(myTeam, aiTeam, G.venue, G.captain, G.aiCaptain);
        G.phase = 'complete';
        save();
        renderResults();
      } catch(e) {
        console.error('Simulate error:', e);
        alert('Simulation error: ' + e.message + '\n\nCheck the browser console for details.');
      }
    });
  }

  function renderResults() {
    const oppSide = opp(G.side);
    document.getElementById('app').innerHTML = `
      <div style="display:flex;flex-direction:column;min-height:100vh;">

            </div>

  async function doReveal(r) {
    const body = document.getElementById('rbody');
    let uPts = 0, aPts = 0, sessU = 0, sessA = 0, rowIdx = 0;

    function fmtPts(p) { return p % 1 === 0 ? String(p) : p.toFixed(1); }

    function updateScoreHeader() {
      const myEl  = document.getElementById('rc-my-score');
      const oppEl = document.getElementById('rc-opp-score');
      if (!myEl || !oppEl) return;
      myEl.textContent  = fmtPts(uPts);
      oppEl.textContent = fmtPts(aPts);
      myEl.className  = 'rc-side-score' + (uPts > aPts ? ' lead' : uPts < aPts ? ' trail' : '');
      oppEl.className = 'rc-side-score' + (aPts > uPts ? ' lead' : aPts < uPts ? ' trail' : '');
    }

    function tick(result) {
      if (result === 'win')        { uPts += 1;   sessU += 1; }
      else if (result === 'halve') { uPts += .5;  aPts += .5; sessU += .5; sessA += .5; }
      else                         { aPts += 1;   sessA += 1; }
      updateScoreHeader();
    }

    function startSess() { sessU = 0; sessA = 0; }

    function appendSessBlock(title, badgeId, contId) {
      body.insertAdjacentHTML('afterbegin', `
        <div class="rc-sess">
          <div class="rc-sess-head">
            <span class="rc-sess-title">${title}</span>
            <span class="rc-sess-score" id="${badgeId}"></span>
          </div>
          <div id="${contId}"></div>
        </div>`);
    }

    function showSessBadge(id) {
      const el = document.getElementById(id);
      if (el) { el.textContent = `${fmtPts(sessU)}–${fmtPts(sessA)}`; el.classList.add('vis'); }
    }

    async function revealMatch(contId, m, ms, singlesNum = null) {
      await delay(ms);
      tick(m.result);
      const id   = 'rc-' + (++rowIdx);
      const cls  = m.result === 'win' ? 'win' : m.result === 'loss' ? 'loss' : 'halve';
      const myNames  = m.myPlayers.filter(Boolean).join(' &amp; ');
      const oppNames = m.oppPlayers.filter(Boolean).join(' &amp; ');
      const numHtml  = singlesNum != null ? `<span class="rc-sing-num">${singlesNum}.</span>` : '';
      const tiredMy  = m.fatigued    ? ' <span class="rc-tired">(f)</span>' : '';
      const tiredOpp = m.oppFatigued ? ' <span class="rc-tired">(f)</span>' : '';
      document.getElementById(contId)?.insertAdjacentHTML('beforeend', `
        <div class="rc-match ${cls}" id="${id}">
          <div class="my">${numHtml}${myNames}${tiredMy}</div>
          <div class="mid">${rLabel(m.result)}</div>
          <div class="opp">${oppNames}${tiredOpp}</div>
        </div>`);
      await delay(40);
      document.getElementById(id)?.classList.add('vis');
      document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── FRIDAY FOURSOMES ──
    startSess();
    appendSessBlock('Friday — Foursomes', 'sb-fri-am', 'sc-fri-am');
    for (const m of r.sessions.fridayAM) await revealMatch('sc-fri-am', m, 1200);
    showSessBadge('sb-fri-am');
    await delay(700);

    // ── FRIDAY FOURBALL ──
    startSess();
    appendSessBlock('Friday — Fourball', 'sb-fri-pm', 'sc-fri-pm');
    for (const m of r.sessions.fridayPM) await revealMatch('sc-fri-pm', m, 1200);
    showSessBadge('sb-fri-pm');
    body.firstElementChild.insertAdjacentHTML('afterend',
      `<div class="rc-day-summary">After Friday — ${G.side} ${fmtPts(uPts)} · ${opp(G.side)} ${fmtPts(aPts)}</div>`);
    await delay(900);

    // ── SATURDAY FOURSOMES ──
    startSess();
    appendSessBlock('Saturday — Foursomes', 'sb-sat-am', 'sc-sat-am');
    for (const m of r.sessions.saturdayAM) await revealMatch('sc-sat-am', m, 1200);
    showSessBadge('sb-sat-am');
    await delay(700);

    // ── SATURDAY FOURBALL ──
    startSess();
    appendSessBlock('Saturday — Fourball', 'sb-sat-pm', 'sc-sat-pm');
    for (const m of r.sessions.saturdayPM) await revealMatch('sc-sat-pm', m, 1200);
    showSessBadge('sb-sat-pm');
    body.firstElementChild.insertAdjacentHTML('afterend',
      `<div class="rc-day-summary">After Saturday — ${G.side} ${fmtPts(uPts)} · ${opp(G.side)} ${fmtPts(aPts)}</div>`);
    await delay(1000);

    // ── SUNDAY SINGLES ──
    startSess();
    appendSessBlock('Sunday — Singles', 'sb-sun', 'sc-sun');
    await delay(600);

    for (let i = 0; i < r.sessions.sunday.length; i++) {
      const m          = r.sessions.sunday[i];
      const cupDecided = uPts > 14 || aPts > 14;
      const msDelay    = cupDecided ? 500 : 1800;
      const isClose    = !cupDecided && i >= 8 && ((14.5 - uPts) <= 2 || (14.5 - aPts) <= 2);

      if (isClose) {
        const dpId = 'dp-' + i;
        document.getElementById('sc-sun')?.insertAdjacentHTML('beforeend',
          `<div class="dramatic-pause" id="${dpId}">Match ${i + 1} — Everything on the line…</div>`);
        document.getElementById(dpId)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        await delay(2500);
        document.getElementById(dpId)?.remove();
      }

      await revealMatch('sc-sun', m, isClose ? 0 : msDelay, i + 1);
    }

    showSessBadge('sb-sun');
    await delay(800);
    showFinalBanner(r, uPts, aPts);
  }

  function showFinalBanner(r, uPts, aPts) {
    const body    = document.getElementById('rbody');
    const oppSide = opp(G.side);
    const w       = r.winner;

    // Highlight winner's score in header
    const myEl  = document.getElementById('rc-my-score');
    const oppEl = document.getElementById('rc-opp-score');
    if (w === 'user' && myEl)  myEl.style.color  = 'var(--win)';
    if (w === 'ai'   && oppEl) oppEl.style.color = 'var(--loss)';

    let bClass, bTitle, bSub;
    if (w === 'user') {
      bClass = 'banner-win';  bTitle = 'The Cup is Yours!';
      bSub   = `${G.side} wins ${r.finalScore.user}–${r.finalScore.ai}`;
    } else if (w === 'ai') {
      bClass = 'banner-loss'; bTitle = 'Defeated';
      bSub   = `${oppSide} wins ${r.finalScore.ai}–${r.finalScore.user}`;
    } else {
      bClass = 'banner-tie';  bTitle = 'The Cup is Shared';
      bSub   = `${r.finalScore.user}–${r.finalScore.ai} — Holders retain the Ryder Cup`;
    }

    const allMy  = G.picks.filter(Boolean);
    const allAI  = G.aiPicks.filter(Boolean);

    // Points actually scored in the match (full credit per player per match won/halved —
    // matches real Ryder Cup individual stat convention, not split between pair partners).
    const allMatches = [...r.sessions.fridayAM, ...r.sessions.fridayPM, ...r.sessions.saturdayAM, ...r.sessions.saturdayPM, ...r.sessions.sunday];
    const myMatchPts = {}, aiMatchPts = {};
    for (const m of allMatches) {
      const oppPts = m.result === 'halve' ? 0.5 : (1 - m.points);
      for (const n of m.myPlayers)  { if (n) myMatchPts[n] = (myMatchPts[n] || 0) + m.points; }
      for (const n of m.oppPlayers) { if (n) aiMatchPts[n] = (aiMatchPts[n]  || 0) + oppPts; }
    }
    function topScorer(picks, ptsMap) {
      return picks.reduce((best, p) => {
        if (!best) return p;
        const pPts = ptsMap[p.name] || 0, bPts = ptsMap[best.name] || 0;
        if (pPts > bPts) return p;
        if (pPts === bPts && compositeScore(p) > compositeScore(best)) return p;
        return best;
      }, null);
    }
    const topMy = topScorer(allMy, myMatchPts);
    const topAI = topScorer(allAI, aiMatchPts);
    const fmtP  = p => p % 1 === 0 ? String(p) : p.toFixed(1);

    const talentTotal = G.picks.reduce((s, p) => s + getTalentScore(p.tier, TALENT_SCORES), 0)
      + (G.captain ? getTalentScore(G.captain.tier, TALENT_SCORES) : 0);
    const chemTotal   = computeTeamChemScore(G.pods, G.captain, G.venue, CUP_RESULTS, VENUES);
    const cupPts       = r.finalScore.user;
    // Winning the actual Ryder Cup counts for more than the raw points scored — 3x for a win,
    // 2.5x for a tie ("Holders retain the Cup"), 2x for a loss. Deliberately a cliff at 14.5,
    // not a smooth curve: winning should feel like it swings the total, not just nudge it.
    const cupMultiplier = w === 'user' ? 3 : w === 'ai' ? 2 : 2.5;
    const cupPtsScaled  = cupPts * cupMultiplier;
    const perfTotal    = talentTotal + chemTotal + cupPtsScaled;

    const shareText = `${G.side} ${r.finalScore.user} — ${oppSide} ${r.finalScore.ai} | ${G.venue.name} | Performance Rating: ${perfTotal} | Top Scorer: ${topMy?.name} (${fmtP(myMatchPts[topMy?.name] || 0)} pts) #Fourballs`;

    body.insertAdjacentHTML('afterbegin', `
      <div class="result-banner ${bClass} fade-in" style="margin:16px 14px 0;">
        <div class="banner-title">${bTitle}</div>
        <div class="banner-sub">${bSub}</div>
      </div>
      <div class="perf-rating-card fade-in">
        <div class="perf-rating-label">Performance Rating</div>
        <div class="perf-rating-total">${perfTotal}</div>
        <div class="perf-rating-breakdown">
          <span><span class="prb-val">${talentTotal}</span><span class="prb-label">Talent</span></span>
          <span class="prb-op">+</span>
          <span><span class="prb-val">${chemTotal}</span><span class="prb-label">Chem</span></span>
          <span class="prb-op">+</span>
          <span><span class="prb-val">${fmtP(cupPts)} <span class="prb-mult">(${fmtP(cupMultiplier)}×)</span> ${fmtP(cupPtsScaled)}</span><span class="prb-label">Cup Pts</span></span>
        </div>
      </div>
      <div class="top-performers fade-in">
        <div class="tp-col">
          <div class="tp-label">Your Top Performer</div>
          ${topMy ? _shieldCardSVG(topMy, false, null, 72) : ''}
          <div class="tp-pts">${fmtP(myMatchPts[topMy?.name] || 0)} pts</div>
        </div>
        <div class="tp-col">
          <div class="tp-label">Their Top Performer</div>
          ${topAI ? _shieldCardSVG(topAI, false, null, 72) : ''}
          <div class="tp-pts">${fmtP(aiMatchPts[topAI?.name] || 0)} pts</div>
        </div>
      </div>
      <div class="share-card fade-in" style="margin:0 14px 16px;">
        <div class="share-btns" style="margin-top:0">
          <button class="btn btn-outline" id="copy-btn">Copy Result</button>
          <button class="btn btn-outline" id="share-btn" style="display:none">Share</button>
          <button class="btn btn-red" id="newgame-btn">New Game</button>
        </div>
      </div>`);

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(shareText)
        .then(() => { document.getElementById('copy-btn').textContent = 'Copied!'; })
        .catch(() => { prompt('Copy this:', shareText); });
    });

    if (navigator.share) {
      const sb = document.getElementById('share-btn');
      sb.style.display = '';
      sb.addEventListener('click', () => navigator.share({ title: 'Fourballs', text: shareText }).catch(()=>{}));
    }

    document.getElementById('newgame-btn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      G = initState();
      save();
      render();
    });
  }

  function _renderTutorial() {
    document.getElementById('tutorial-overlay')?.remove();
    const step   = TUTORIAL_STEPS[_tutStep];

    const isLast = _tutStep === total - 1;

      `<div class="tut-dot${i === _tutStep ? ' active' : ''}"></div>`

        <div class="tut-dots">${dots}</div>

          <button class="btn btn-gold" id="tut-next">${isLast ? 'Done ✓' : 'Next →'}</button>
        </div>
      </div>`;
    document.body.appendChild(div);

    document.getElementById('tut-skip').addEventListener('click', closeTutorial);
    document.getElementById('tut-next').addEventListener('click', () => {
      if (isLast) closeTutorial();
      else { _tutStep++; _renderTutorial(); }

    document.getElementById('tutorial-overlay')?.remove();
    localStorage.setItem('tutorial_seen', '1');

  // ─────────────────────────────────────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const [venues, captains, players, cupResults, talentScores] = await Promise.all([
        fetch('data/venues.json').then(r => r.json()),
        fetch('data/captains.json').then(r => r.json()),
        fetch('data/players.json').then(r => r.json()),
        fetch('data/cup_results.json').then(r => r.json()),
        fetch('data/talent_scores.json').then(r => r.json()),
      ]);
      VENUES        = venues;
      CAPTAINS      = captains;
      PLAYERS       = players;
      CUP_RESULTS   = cupResults;
      TALENT_SCORES = talentScores;
      CAPTAIN_IDS   = new Set(CAPTAINS.map(c => c.id));
    } catch(err) {
      document.getElementById('app').innerHTML = `
        <div class="center-screen">
          <h2>Open with a local web server</h2>
          <p>This game loads data files that require a local server — it cannot run directly from the filesystem.</p>
          <p style="margin-top:10px;">In VS Code, right-click <code>index.html</code> → <strong>Open with Live Server</strong>.</p>
          <p style="margin-top:6px;">Or run: <code>npx serve .</code> in this folder.</p>
          <p style="margin-top:10px;font-size:12px;color:var(--text-dim)">${err.message}</p>
        </div>`;
      return;
    }

    // Inject persistent help button
    const helpBtn = document.createElement('button');
    helpBtn.className = 'help-btn';
    helpBtn.id = 'global-help-btn';
    helpBtn.textContent = '?';
    helpBtn.title = 'Help & Tier Odds';
    helpBtn.addEventListener('click', showHelpModal);
    document.body.appendChild(helpBtn);

    try {
      G = initState();
      // Don't save here — preserve any existing save so the Continue button can restore it.

      render();

      if (!localStorage.getItem('tutorial_seen')) {
        setTimeout(() => showTutorial(0), 600);
      }
    } catch(err) {
      // Stale save or render crash — wipe state and restart clean
      try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
      G = initState();
      save();
      try {
        render();
      } catch(e) {
        document.getElementById('app').innerHTML = `
          <div class="center-screen">
            <h2 style="color:var(--gold)">Something went wrong</h2>
            <p>Your saved game was cleared. Refresh to start a new game.</p>
            <p style="margin-top:10px;font-size:12px;color:var(--text-dim)">${e.message}</p>
          </div>`;
      }
    }
  }

  init();
  </script>
</body>
</html>
