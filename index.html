<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fourballs — Ryder Cup Draft</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080f08;
      --surface:      #0f1a0f;
      --surface2:     #142014;
      --surface3:     #1a2a1a;
      --border:       #1e341e;
      --green:        #2d6a2d;
      --green-bright: #4caf50;
      --gold:         #c9a84c;
      --text:         #ddeedd;
      --text-muted:   #6a8f6a;
      --text-dim:     #405040;
      --win:          #4caf50;
      --loss:         #e53935;
      --halve:        #c9a84c;
      --radius:       8px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.5; }
    #app { min-height: 100vh; }

    /* ── BUTTONS ── */
    .btn { background: var(--green); color: var(--text); border: none; border-radius: var(--radius); padding: 11px 22px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s; }
    .btn:hover:not(:disabled) { background: #3a843a; transform: translateY(-1px); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-gold { background: var(--gold); color: #1a0e00; font-size: 17px; padding: 14px 36px; }
    .btn-gold:hover:not(:disabled) { background: #d4b05e; }
    .btn-red  { background: #b71c1c; color: #fff; }
    .btn-red:hover:not(:disabled) { background: #c62828; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--surface2); border-color: var(--green); }

    /* ── HEADER / TICKER ── */
    .page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 9px 16px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 20; }
    .page-title  { font-size: 14px; font-weight: 800; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
    .ticker-score { font-size: 15px; font-weight: 700; color: var(--gold); }

    /* ── LANDING ── */
    .landing-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; background: radial-gradient(ellipse at 50% 30%, #0a2010 0%, var(--bg) 65%); }
    .landing-logo { font-size: 58px; font-weight: 900; color: var(--gold); letter-spacing: .04em; line-height: 1; margin-bottom: 10px; }
    .landing-rule { width: 60px; height: 2px; background: var(--green); margin: 12px auto; }
    .landing-tagline { font-size: 18px; color: var(--text); margin-bottom: 6px; }
    .landing-flavor { font-size: 13px; color: var(--text-muted); font-style: italic; margin-bottom: 36px; }
    .landing-continue { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
    .landing-continue a { color: var(--green-bright); cursor: pointer; text-decoration: underline; }

    /* ── NATIONALITY ── */
    .nation-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; background: radial-gradient(ellipse at 50% 30%, #0a1a2a 0%, var(--bg) 70%); }
    .nation-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); margin-bottom: 8px; }
    .nation-title { font-size: 34px; font-weight: 800; color: var(--text); margin-bottom: 30px; }
    .nation-cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .nation-card { background: var(--surface2); border: 2px solid var(--border); border-radius: 12px; padding: 28px 36px; cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s; min-width: 160px; }
    .nation-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,.5); }
    .nation-card.usa:hover { border-color: #3b6abf; }
    .nation-card.eur:hover { border-color: #5a40b0; }
    .nation-flag { font-size: 42px; margin-bottom: 10px; }
    .nation-name { font-size: 20px; font-weight: 700; }
    .nation-sub  { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    /* ── VENUE SPINNER ── */
    .spinner-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; background: radial-gradient(ellipse at 50% 20%, #0f2a0f 0%, var(--bg) 70%); }
    .spin-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); margin-bottom: 20px; }
    .spin-reel { font-size: 40px; font-weight: 800; color: var(--text); line-height: 1.1; max-width: 560px; transition: color .4s; min-height: 96px; display: flex; align-items: center; justify-content: center; }
    .spin-reel.landed { color: var(--gold); }
    .spin-sub { font-size: 14px; color: var(--text-muted); margin-top: 10px; min-height: 22px; }

    /* ── VENUE REVEAL ── */
    .venue-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 20%, #0f2a0f 0%, var(--bg) 70%); }
    .venue-name { font-size: 38px; font-weight: 800; line-height: 1.1; margin-bottom: 8px; max-width: 600px; }
    .venue-sub  { font-size: 15px; color: var(--text-muted); margin-bottom: 14px; }
    .venue-badge { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
    .venue-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    .pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text-muted); }
    .venue-flavor { font-style: italic; color: var(--text-muted); max-width: 460px; margin-bottom: 30px; font-size: 14px; }

    /* ── PLAYER CARDS ── */
    .player-card { background: color-mix(in srgb, var(--tc, #444) 10%, var(--surface2)); border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--tc, #444) 30%, var(--border)); border-left: 4px solid var(--tc, #444); padding: 8px; cursor: pointer; transition: transform .15s, box-shadow .15s; position: relative; aspect-ratio: 10 / 16; max-height: 240px; display: flex; flex-direction: column; overflow: hidden; }
    .player-card:hover { transform: translateY(-2px); box-shadow: 0 4px 18px rgba(0,0,0,.45); }
    .player-card.selected { border-color: var(--green-bright) !important; box-shadow: 0 0 12px rgba(76,175,80,.35); }
    .player-card.hero-card { animation: hero-glow 2s ease-in-out infinite; }
    @keyframes hero-glow { 0%,100% { box-shadow: 0 0 8px rgba(94,200,232,.35); } 50% { box-shadow: 0 0 22px rgba(94,200,232,.7); } }
    .card-name  { font-size: 14px; font-weight: 700; line-height: 1.15; padding-right: 18px; }
    .card-year  { font-size: 13px; color: var(--gold); font-weight: 600; }
    /* Card art & per-card-year indicators */
    .card-icon-art { display: flex; justify-content: center; align-items: center; padding: 6px 0 4px; pointer-events: none; }
    .card-indicators { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .ci-icon { width: 13px; height: 13px; flex-shrink: 0; }
    .ci-flag       { color: #7dd3fc; }
    .ci-trophy-won { color: #c9a84c; }
    .ci-trophy-lost{ color: #3a4a3a; }

    .tc-platinum { --tc: #c084fc; } .tc-gold { --tc: #c9a84c; } .tc-silver { --tc: #94a3b8; } .tc-bronze { --tc: #a0522d; } .tc-hero { --tc: #5ec8e8; }
    .card-tier-badge { position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 3px; background: rgba(0,0,0,.45); color: var(--tc, #888); border: 1px solid var(--tc, #888); }
    /* Silver highlight ring on hero badge to distinguish from platinum at small sizes */
    .tier-hero .card-tier-badge { box-shadow: 0 0 0 1.5px rgba(255,255,255,.5); }

    /* ── COURSE PROFILE BAR ── */
    .course-profile-bar { background: rgba(255,255,255,.03); border-bottom: 1px solid var(--border); padding: 6px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .cpb-venue { font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap; flex-shrink: 0; }
    .cpb-sep { color: var(--text-dim); font-size: 10px; flex-shrink: 0; }
    .cpb-icon-row { display: flex; gap: 3px; align-items: center; flex-wrap: nowrap; overflow: hidden; flex: 1; min-width: 0; }
    .cpb-icon-chip { display: flex; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; padding: 2px 6px; background: rgba(255,255,255,.05); border-radius: 3px; }
    .cpb-icon-chip .attr-icon-svg { width: 11px; height: 11px; }
    .cpb-cap-mini { margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 5px; border: 1px solid; border-radius: 4px; padding: 2px 8px 2px 5px; }
    .cpb-cap-tier { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }
    .cpb-cap-name { font-size: 10px; font-weight: 700; color: var(--text); white-space: nowrap; }

    /* ── DRAFT LAYOUT ── */
    /* 4 grid rows: header / course-strip / team-board(grows) / pick-area */
    /* 100dvh = real visible viewport on mobile (accounts for address bar) */
    .draft-full { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; }
    .draft-team-area { display: flex; flex-direction: column; justify-content: safe center; overflow-y: auto; min-height: 0; }

    /* ── DRAFT PICK AREA ── */
    .pick-area { padding: 8px 10px 10px; background: var(--surface); border-top: 1px solid var(--border); }
    .pick-round-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    /* 3 fixed-width shield columns, spread out (wide gap) rather than scrunched
       together — kept centred rather than edge-to-edge so the rightmost card
       never sits under the fixed help button in the bottom-right corner. */
    .pick-cards-row { display: grid; grid-template-columns: repeat(3, 60px); gap: 36px; justify-content: center; }

    /* ── PLAYER MINI (reused in pairing seats) ── */
    .player-mini { width: 100%; padding: 5px 8px; border-radius: 4px; border-left: 3px solid var(--tc, #444); background: var(--surface3); }
    .pm-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-meta { font-size: 10px; color: var(--text-muted); }

    /* ── CAPTAIN SCREEN ── */
    .captain-screen { display: flex; flex-direction: column; align-items: center; padding: 20px 14px 40px; background: radial-gradient(ellipse at 50% 0%, #1a0a2a 0%, var(--bg) 70%); min-height: 100vh; }
    .captain-title { font-size: 26px; font-weight: 800; color: var(--gold); text-align: center; margin-bottom: 6px; }
    /* 3 columns always — matches the player selection card layout */
    .captain-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; width: 100%; max-width: 480px; margin-left: auto; margin-right: auto; }
    .captain-card  { border: 1px dashed; border-radius: var(--radius); padding: 12px 10px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .captain-card:hover { transform: translateY(-3px); box-shadow: 0 6px 22px rgba(0,0,0,.5); }
    .cap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .cap-tier-badge { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; border: 1px solid; border-radius: 3px; padding: 2px 5px; }
    .cap-years { font-size: 9px; color: var(--text-muted); }
    .cap-captain-pill { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #c9a84c; border: 1px solid rgba(201,168,76,.5); border-radius: 3px; padding: 1px 5px; background: rgba(201,168,76,.08); }
    .cap-icon-art { display: flex; justify-content: center; margin: 4px 0 6px; pointer-events: none; }
    .cap-name { font-size: 14px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
    .cap-tagline { font-size: 9px; color: var(--text-muted); font-style: italic; line-height: 1.35; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cap-perks { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .cap-perk-pill { background: rgba(255,255,255,.05); border-radius: 3px; padding: 4px 6px; }
    .cap-perk-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--gold); display: block; margin-bottom: 1px; }
    .cap-perk-desc  { font-size: 9px; color: var(--text-dim); line-height: 1.3; }
    .cap-special-box { background: rgba(201,168,76,.1); border: 1px solid rgba(201,168,76,.35); border-radius: 3px; padding: 5px 7px; margin-top: 6px; }
    .cap-special-label { font-size: 9px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 1px; }
    .cap-special-desc  { font-size: 9px; color: rgba(201,168,76,.8); line-height: 1.3; }


    /* ── REVIEW SCREEN ── */
    .review-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1; }
    @media (max-width: 680px) { .review-layout { grid-template-columns: 1fr; } }
    .review-col { padding: 14px 14px 24px; border-right: 1px solid var(--border); }
    .review-col:last-child { border-right: none; }
    .review-col-title { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
    .review-slot-group { margin-bottom: 14px; }
    .review-slot-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 5px; }
    .chem-pair { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--surface2); border-radius: 4px; margin-bottom: 3px; font-size: 13px; }
    .chem-pair .cp-names { flex: 1; }
    /* Chemistry dots — 3 shapes for colorblind distinction: filled=strong, donut=neutral, hollow=weak */
    .chem-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .chem-strong  { background: var(--win); }
    .chem-neutral { background: #eab308; box-shadow: inset 0 0 0 4px rgba(8,15,8,.85); }
    .chem-weak    { background: transparent; border: 2.5px solid #ef4444; }
    .card-chem-dot { position: absolute; top: 7px; left: 7px; width: 14px; height: 14px; border-radius: 50%; }
    .captain-summary { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-top: 10px; font-size: 12px; }
    .simulate-bar { padding: 16px 16px 32px; text-align: center; border-top: 1px solid var(--border); }

    /* ── RESULTS SCREEN ── */
    .results-layout { display: flex; gap: 20px; max-width: 1060px; margin: 0 auto; padding: 16px 16px 48px; align-items: flex-start; width: 100%; }
    .results-feed { flex: 1; min-width: 0; }
    .results-sidebar { width: 168px; flex-shrink: 0; }
    @media (max-width: 680px) { .results-layout { flex-direction: column-reverse; } .results-sidebar { width: 100%; } }

    .score-panel { position: sticky; top: 48px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px; text-align: center; }
    .sp-total-label { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 4px; }
    .sp-total-score { font-size: 32px; font-weight: 900; color: var(--gold); line-height: 1; margin-bottom: 4px; }
    .sp-team-names { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .sp-divider { height: 1px; background: var(--border); margin: 10px 0; }
    .sp-sess-label { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 3px; }
    .sp-sess-name { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; min-height: 16px; }
    .sp-sess-score { font-size: 20px; font-weight: 800; color: var(--text); }

    .session-block { margin-bottom: 6px; }
    .session-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 20px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .session-header { font-size: 19px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
    .session-score-badge { font-size: 15px; font-weight: 800; color: var(--gold); white-space: nowrap; opacity: 0; transition: opacity .5s; }
    .session-score-badge.visible { opacity: 1; }
    .sub-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin: 12px 0 6px; }
    .session-summary { text-align: center; font-size: 13px; color: var(--text-muted); padding: 6px 0 4px; }

    .match-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 5px; background: var(--surface2); margin-bottom: 5px; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; font-size: 13px; }
    .match-row.revealed { opacity: 1; transform: none; }
    .match-num { font-size: 11px; color: var(--text-dim); min-width: 22px; }
    .match-players { flex: 1; }
    .match-pts { font-size: 11px; color: var(--text-muted); min-width: 28px; text-align: right; }
    .match-result { font-weight: 700; font-size: 14px; min-width: 18px; text-align: right; }
    .r-win  { color: var(--win); }
    .r-loss { color: var(--loss); }
    .r-half { color: var(--halve); }

    .result-banner { border-radius: var(--radius); padding: 36px 20px; text-align: center; margin: 20px 0; }
    .banner-win  { background: linear-gradient(135deg, #0f2a0f, #1e4a1e); border: 1px solid #2d6a2d; }
    .banner-loss { background: linear-gradient(135deg, #1a0808, #3a1010); border: 1px solid #5a1818; }
    .banner-tie  { background: linear-gradient(135deg, #0a0a1a, #1a1a3a); border: 1px solid #2a2a5a; }
    .banner-title { font-size: 36px; font-weight: 800; margin-bottom: 8px; }
    .banner-sub   { font-size: 16px; color: var(--text-muted); }
    .share-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 20px 0; }
    .share-card h3 { color: var(--gold); margin-bottom: 12px; font-size: 15px; }
    .share-card p  { font-size: 13px; margin-bottom: 5px; }
    .share-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

    .perf-rating-card { background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius); padding: 20px; margin: 0 14px 14px; text-align: center; }
    .perf-rating-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 4px; }
    .perf-rating-total { font-size: 44px; font-weight: 800; color: var(--gold); line-height: 1; margin-bottom: 12px; }
    .perf-rating-breakdown { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .perf-rating-breakdown .prb-val { display: block; font-size: 18px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .perf-rating-breakdown .prb-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
    .prb-op { color: var(--text-dim); font-size: 16px; }
    .prb-mult { font-size: 12px; font-weight: 700; color: var(--gold); }

    .top-performers { display: flex; gap: 12px; margin: 0 14px 16px; }
    .tp-col { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; }
    .tp-label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 8px; }
    .tp-col svg { margin: 0 auto; }
    .tp-pts { font-size: 15px; font-weight: 700; color: var(--gold); margin-top: 6px; }

    .dramatic-pause { text-align: center; padding: 18px; color: var(--gold); font-style: italic; font-size: 14px; animation: dpulse 1s ease-in-out infinite; }
    @keyframes dpulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

    /* ── RC SCOREBOARD (results) ── */
    .rc-board { max-width: 600px; margin: 0 auto; padding-bottom: 56px; }
    .rc-score-hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--surface2); padding: 12px 16px; text-align: center; position: sticky; top: 48px; z-index: 10; border-bottom: 2px solid var(--border); }
    .rc-side-name { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .rc-side-score { font-size: 38px; font-weight: 900; line-height: 1; color: var(--text); transition: color .4s; }
    .rc-side-score.lead { color: var(--win); }
    .rc-side-score.trail { color: var(--text-dim); }
    .rc-vs-sep { font-size: 11px; color: var(--text-dim); font-weight: 700; letter-spacing: .06em; padding: 0 8px; }
    .rc-sess { border-bottom: 1px solid var(--border); }
    .rc-sess-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px 7px; background: rgba(255,255,255,.025); }
    .rc-sess-title { font-size: 13px; font-weight: 800; color: var(--gold); }
    .rc-sess-score { font-size: 11px; color: var(--text-muted); opacity: 0; transition: opacity .6s; font-weight: 700; }
    .rc-sess-score.vis { opacity: 1; }
    .rc-match { display: grid; grid-template-columns: 1fr 28px 1fr; gap: 4px; align-items: center; padding: 7px 14px; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; line-height: 1.35; opacity: 0; transform: translateY(4px); transition: opacity .3s, transform .3s; }
    .rc-match.vis { opacity: 1; transform: none; }
    .rc-match .my { text-align: right; }
    .rc-match .opp { text-align: left; }
    .rc-match .mid { text-align: center; font-weight: 800; font-size: 14px; }
    .rc-match.win .my  { color: var(--win); font-weight: 700; }
    .rc-match.win .mid { color: var(--win); }
    .rc-match.win .opp { color: var(--text-dim); }
    .rc-match.loss .opp { color: var(--loss); font-weight: 700; }
    .rc-match.loss .mid { color: var(--loss); }
    .rc-match.loss .my  { color: var(--text-dim); }
    .rc-match.halve .my, .rc-match.halve .opp, .rc-match.halve .mid { color: var(--halve); }
    .rc-sing-num { font-size: 13px; color: var(--text-dim); margin-right: 3px; }
    .rc-tired { font-size: 13px; color: var(--halve); opacity: .7; }
    .rc-day-summary { padding: 7px 14px; font-size: 11px; color: var(--gold); font-style: italic; text-align: center; background: rgba(201,168,76,.04); }

    /* ── UTILS ── */
    .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--green-bright); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; gap: 14px; }
    .center-screen h2 { color: var(--gold); }
    .center-screen p  { color: var(--text-muted); max-width: 440px; font-size: 14px; }
    .center-screen code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .fade-in { animation: fadein .3s ease-out; }
    @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    /* ── ATTRIBUTE ICONS (draft selection + picked cards) ── */
    .attr-icons { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .attr-icon-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .attr-icon-svg { width: 13px; height: 13px; display: block; }
    .attr-icon-label { font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }

    /* ── TEAM BOARD (top of draft screen) ── */
    .picks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 5px 10px 6px; }
    /* Compact filled card — no aspect-ratio so 3 rows of 4 fit without scrolling */
    .player-picked { background: color-mix(in srgb, var(--tc, #444) 18%, var(--surface2)); border-radius: 5px; border-left: 3px solid var(--tc, #444); padding: 5px 5px 4px; display: flex; flex-direction: column; overflow: hidden; position: relative; min-height: 44px; }
    /* Compact board chem chip — shows score number inline (no tooltip) */
    .pp-chem-chip { position: absolute; top: 3px; right: 3px; font-size: 9px; font-weight: 800; border-radius: 3px; padding: 1px 4px; line-height: 1.3; color: var(--bg); }
    .pp-chem-chip.chem-strong  { background: var(--win); }
    .pp-chem-chip.chem-neutral { background: #eab308; }
    .pp-chem-chip.chem-weak    { background: #ef4444; }
    .pp-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .pp-year { font-size: 10px; color: var(--gold); margin-top: 1px; }
    /* Empty slot placeholder */
    .pick-slot-empty { min-height: 44px; border: 1px dashed rgba(255,255,255,.1); border-radius: 5px; display: flex; align-items: center; justify-content: center; }
    .pse-num { font-size: 10px; color: var(--text-dim); font-weight: 600; }

    /* ── POD BUILDER (captain hub + 3 pods) ── */
    /* Radial "upside-down tri-star" layout: Pod A straight up from the hub,
       Pod B/C spread wide left/right and only shallowly below the hub (not
       stacked directly underneath), so the three divider lines fan out at
       roughly even angles instead of bunching near-parallel by the hub. */
    /* Golf-green backdrop: a single asymmetric mowed green (an oblong/kidney
       silhouette, not a plain oval or circle — loosely modeled on Augusta
       National's 12th, which reads more like a squash than a round green),
       with its own stripe pattern and a flagstick. No fairway/bunker/water
       shapes anymore — just the green, kept simple per feedback. A flat
       dark linear-gradient is layered OVER the art (not baked into its own
       colors) so it reads as a faint backdrop rather than competing with
       the pod cards on top of it — easy to tune by adjusting that overlay's
       alpha alone. Built as a single SVG data-URI so it needs no separate
       image asset. */
    .squad-hub-area {
      position: relative;
      border-radius: 12px;
      background-color: #0e2015;
      background-image:
        linear-gradient(rgba(8,15,8,.7), rgba(8,15,8,.7)),
        url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20800%20420'%3E%3Cdefs%3E%3CclipPath%20id%3D'green'%3E%3Cpath%20d%3D'M110%2C229.9%20C108.5%2C214.4%20108.5%2C186.9%20120%2C167.6%20C131.4%2C148.2%20155.3%2C127.5%20178.6%2C113.9%20C201.9%2C100.4%20231.6%2C93.2%20259.7%2C86.5%20C287.7%2C79.9%20322%2C74.4%20347%2C74%20C371.9%2C73.6%20390.6%2C79.9%20409.4%2C84%20C428.1%2C88.2%20440.5%2C96.9%20459.2%2C99%20C478%2C101.1%20500.8%2C95.4%20521.6%2C96.5%20C542.4%2C97.5%20564.2%2C99.6%20584%2C105.2%20C603.7%2C110.8%20623.9%2C119.8%20640.1%2C130.2%20C656.3%2C140.6%20673%2C155.1%20681.3%2C167.6%20C689.6%2C180.1%20691.7%2C192.5%20690%2C205%20C688.3%2C217.5%20681.7%2C229.9%20671.3%2C242.4%20C660.9%2C254.9%20646.3%2C268.8%20627.6%2C279.8%20C608.9%2C290.9%20585%2C300.2%20559%2C308.5%20C533%2C316.8%20502.9%2C325.2%20471.7%2C329.7%20C440.5%2C334.3%20405.2%2C336.6%20371.9%2C336%20C338.7%2C335.3%20303.3%2C332.2%20272.2%2C326%20C241%2C319.8%20208.7%2C309.4%20184.8%2C298.5%20C160.9%2C287.7%20141.2%2C272.6%20128.7%2C261.1%20C116.2%2C249.7%20111.5%2C245.5%20110%2C229.9%20Z'%2F%3E%3C%2FclipPath%3E%3Cpattern%20id%3D'stripes'%20width%3D'40'%20height%3D'40'%20patternUnits%3D'userSpaceOnUse'%20patternTransform%3D'rotate(112)'%3E%3Crect%20width%3D'40'%20height%3D'40'%20fill%3D'%233a8446'%2F%3E%3Crect%20width%3D'20'%20height%3D'40'%20fill%3D'%23347a3f'%2F%3E%3C%2Fpattern%3E%3C%2Fdefs%3E%3Cg%20clip-path%3D'url(%23green)'%3E%3Crect%20x%3D'90'%20y%3D'60'%20width%3D'620'%20height%3D'300'%20fill%3D'url(%23stripes)'%2F%3E%3C%2Fg%3E%3Cpath%20d%3D'M110%2C229.9%20C108.5%2C214.4%20108.5%2C186.9%20120%2C167.6%20C131.4%2C148.2%20155.3%2C127.5%20178.6%2C113.9%20C201.9%2C100.4%20231.6%2C93.2%20259.7%2C86.5%20C287.7%2C79.9%20322%2C74.4%20347%2C74%20C371.9%2C73.6%20390.6%2C79.9%20409.4%2C84%20C428.1%2C88.2%20440.5%2C96.9%20459.2%2C99%20C478%2C101.1%20500.8%2C95.4%20521.6%2C96.5%20C542.4%2C97.5%20564.2%2C99.6%20584%2C105.2%20C603.7%2C110.8%20623.9%2C119.8%20640.1%2C130.2%20C656.3%2C140.6%20673%2C155.1%20681.3%2C167.6%20C689.6%2C180.1%20691.7%2C192.5%20690%2C205%20C688.3%2C217.5%20681.7%2C229.9%20671.3%2C242.4%20C660.9%2C254.9%20646.3%2C268.8%20627.6%2C279.8%20C608.9%2C290.9%20585%2C300.2%20559%2C308.5%20C533%2C316.8%20502.9%2C325.2%20471.7%2C329.7%20C440.5%2C334.3%20405.2%2C336.6%20371.9%2C336%20C338.7%2C335.3%20303.3%2C332.2%20272.2%2C326%20C241%2C319.8%20208.7%2C309.4%20184.8%2C298.5%20C160.9%2C287.7%20141.2%2C272.6%20128.7%2C261.1%20C116.2%2C249.7%20111.5%2C245.5%20110%2C229.9%20Z'%20fill%3D'none'%20stroke%3D'%23255e2e'%20stroke-width%3D'3'%2F%3E%3Cline%20x1%3D'300'%20y1%3D'120'%20x2%3D'300'%20y2%3D'160'%20stroke%3D'%23dcdcdc'%20stroke-width%3D'1.5'%2F%3E%3Cpath%20d%3D'M300%2C120%20L322%2C128%20L300%2C136%20Z'%20fill%3D'%23c0392b'%2F%3E%3C%2Fsvg%3E");
      background-size: cover;
      background-position: center;
    }
    /* --hub-scale is set by fitSquadHub() (JS) to fill the leftover vertical
       space in draft-team-area instead of sitting at a fixed size in a much
       taller flex box. Defaults to 1 so the layout is correct even before
       JS runs. Every size/offset below that was originally a tuned literal
       px value is expressed as calc(literal * var(--hub-scale,1)) so the
       whole cluster scales as one unit — a transform:scale() was tried
       first but squad-hub-wrap's own box is `width:100%` (mostly empty
       space around the centered content), so scaling the element scaled
       that phantom box too and blew out the page's scrollWidth. Scaling
       the real literals instead has no such phantom box to inflate. */
    .squad-hub-wrap { position: relative; width: 100%; height: calc(300px * var(--hub-scale, 1)); margin: 0 auto; padding: 4px 8px 6px; }
    .pod-row-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; }
    .pod-row-mid { position: absolute; top: calc(171px * var(--hub-scale, 1)); left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center; }
    .pod-row-bot { position: absolute; inset: 0; pointer-events: none; }
    .pod-row-bot .pod-group:nth-child(1) { position: absolute; top: calc(192px * var(--hub-scale, 1)); left: calc(50% - (158px * var(--hub-scale, 1))); }
    .pod-row-bot .pod-group:nth-child(2) { position: absolute; top: calc(192px * var(--hub-scale, 1)); left: calc(50% + (20px * var(--hub-scale, 1))); }
    .pod-group { display: flex; flex-direction: column; align-items: center; gap: calc(3px * var(--hub-scale, 1)); pointer-events: auto; }
    .pod-label { font-size: calc(8px * var(--hub-scale, 1)); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
    .pod-slots { display: grid; grid-template-columns: calc(60px * var(--hub-scale, 1)) calc(60px * var(--hub-scale, 1)); gap: calc(18px * var(--hub-scale, 1)); }
    .tray-card { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    /* Pod slot: transparent container, SVG handles all visuals */
    .pod-slot { width: calc(60px * var(--hub-scale, 1)); height: calc(60px * var(--hub-scale, 1)); position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; flex-shrink: 0; }
    .pod-slot > svg { pointer-events: none; display: block; width: 100%; height: 100%; }
    .pod-slot.filled { cursor: grab; }
    .pod-slot.filled:active { cursor: grabbing; }
    .pod-slot.drop-ok { filter: drop-shadow(0 0 5px #22c55e); }
    /* Captain hub: same shield shape as draft/pod cards, sized 10% larger (see HUB_SIZE) */
    .captain-hub-node { width: calc(66px * var(--hub-scale, 1)); height: calc(66px * var(--hub-scale, 1)); position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: none; }
    .captain-hub-node > svg { pointer-events: none; display: block; width: 100%; height: 100%; }
    .captain-hub-node.drop-ok { filter: drop-shadow(0 0 8px rgba(201,168,76,.7)); }
    /* SVG connection lines overlay */
    .conn-svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; width: 100%; height: 100%; }
    /* Drag ghost */
    .drag-ghost { position: fixed; pointer-events: none; z-index: 999; opacity: .92; transform: translate(-50%, -65%); filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); }
    /* Squad header row */
    .squad-stat-row { display: flex; align-items: center; gap: 16px; padding: 4px 10px; font-size: 13px; }
    .ssn-label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .ssn-val { color: var(--gold); font-weight: 800; font-size: 16px; }
    .ssn-total .ssn-val { color: #7dd3fc; }
    /* Submit-to-pairings / next-selection bar. min-height matches .pick-area's natural
       height (the tray-card row) so the pod board above doesn't grow/shrink between the
       "picking" and "next selection"/"submit" states -- .draft-team-area is the grid's only
       1fr row, so any difference in the bottom bar's height directly changes how much room
       fitSquadHub() has to work with, visibly resizing the whole pod board each round. */
    .pod-submit-bar { padding: 10px 12px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 108px; box-sizing: border-box; }

    /* ── HELP BUTTON (persistent ?) ── */
    .help-btn { position: fixed; bottom: 16px; right: 16px; z-index: 90; width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
    /* On the draft screen the same button is re-parented into squad-hub-area
       instead of floating fixed over the bottom-right corner — that corner is
       where the draft tray needs the room, especially on mobile. */
    .help-btn.help-btn-inline { position: absolute; top: 6px; right: 6px; bottom: auto; width: 26px; height: 26px; font-size: 13px; z-index: 5; }
    .help-btn:hover { background: var(--surface3); border-color: var(--green); color: var(--text); }

    /* ── HELP MODAL ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .help-modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; }
    .help-modal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .help-modal-title { font-size: 18px; font-weight: 800; color: var(--gold); }
    .help-modal-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .help-modal-close:hover { color: var(--text); }
    .help-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); margin: 14px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .tier-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tier-table th, .tier-table td { padding: 5px 7px; border: 1px solid var(--border); text-align: center; }
    .tier-table th { background: var(--surface2); color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .tier-table td:first-child { text-align: left; color: var(--text-muted); }
    .how-to-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; }
    .how-to-list li { font-size: 13px; color: var(--text); padding-left: 18px; position: relative; line-height: 1.45; }
    .how-to-list li::before { content: '→'; position: absolute; left: 0; color: var(--gold); font-size: 11px; top: 2px; }

    /* ── TUTORIAL OVERLAY ── */
    .tutorial-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .tutorial-card { background: var(--surface); border: 1px solid var(--green); border-radius: var(--radius); max-width: 420px; width: 100%; padding: 24px; animation: fadein .25s ease-out; }

    /* ── MODE TOGGLE (nationality screen) ── */
    .mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 0 auto 6px; width: fit-content; }
    .mode-btn { padding: 7px 20px; font-size: 13px; font-weight: 600; background: transparent; color: var(--text-muted); border: none; cursor: pointer; transition: all .18s; }
    .mode-btn.active { background: var(--gold); color: #111; }
    .mode-desc-text { text-align: center; font-size: 11px; color: var(--text-dim); min-height: 16px; }

    /* ── ADVANCED PAIRING SCREEN ── */
    .adv-section { margin-bottom: 22px; }
    .adv-sect-title { font-size: 13px; font-weight: 700; color: var(--text); padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .adv-sect-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
    .adv-pair-row { display: grid; grid-template-columns: 18px 1fr 18px 1fr auto; align-items: center; gap: 5px; margin-bottom: 7px; }
    .adv-pair-num { font-size: 11px; color: var(--text-dim); text-align: right; font-weight: 600; }
    .adv-plus { font-size: 13px; color: var(--text-dim); text-align: center; }
    .adv-chem { display: flex; align-items: center; gap: 4px; min-width: 88px; }
    .adv-slot { padding: 7px 9px; border-radius: 6px; border: 1px dashed var(--border); font-size: 12px; cursor: pointer; min-height: 34px; display: flex; align-items: center; transition: border-color .15s; }
    .adv-slot.empty { color: var(--text-dim); justify-content: center; font-size: 11px; }
    .adv-slot.empty:hover { border-color: var(--gold); color: var(--gold); }
    .adv-slot.filled { border-style: solid; justify-content: space-between; gap: 4px; }
    .adv-slot-name { font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .adv-slot-x { font-size: 15px; color: var(--text-dim); cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0; }
    .adv-slot-x:hover { color: var(--loss); }
    .adv-badge { font-size: 9px; color: var(--gold); background: rgba(201,168,76,.15); border: 1px solid rgba(201,168,76,.3); border-radius: 3px; padding: 1px 4px; }

    /* ── PLAYER PICKER MODAL ── */
    .adv-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: flex-end; }
    .adv-modal { background: var(--surface2); border-top: 2px solid var(--border); width: 100%; max-height: 72vh; overflow-y: auto; padding: 16px 14px 28px; border-radius: 14px 14px 0 0; }
    .adv-modal-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; text-align: center; color: var(--text-muted); }
    .adv-modal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .adv-pick-card { padding: 9px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color .15s, background .15s; text-align: center; }
    .adv-pick-card:hover { border-color: var(--gold); }
    .tut-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 6px; }
    .tut-title { font-size: 22px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
    .tut-body { font-size: 14px; color: var(--text); line-height: 1.55; margin-bottom: 20px; }
    .tut-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
    .tut-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background .2s; }
    .tut-dot.active { background: var(--gold); }
    .tut-actions { display: flex; gap: 10px; }
    .tut-actions .btn { flex: 1; font-size: 14px; padding: 10px; }

    /* ── RESPONSIVE ── */
    /* Placed last on purpose: at equal specificity CSS resolves ties by source
       order, so a mobile override declared before the desktop rule it targets
       silently loses even when its media query matches. This block must stay
       after every rule it overrides. */
    @media (max-width: 480px) {
      /* Draft tray: fr-based columns filling the available width (no
         artificial max-width cap anymore — the card fills whatever its grid
         cell gives it, via the aspect-ratio + 100% svg override below), so
         these scale up with the actual device width instead of topping out
         at a number picked for one phone size. */
      .pick-cards-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 88%; margin: 0 auto; justify-content: unset; }
      .tray-card { width: 100%; aspect-ratio: 1; }
      .tray-card svg { width: 100%; height: 100%; }
      .pick-area { overflow-y: visible; padding: 14px 6px 16px; }
      /* Mobile tray cards are fr-based (scale with viewport width) so .pick-area's natural
         height isn't a fixed number here either -- this is calibrated at a ~375px-wide phone,
         the common case, not a pixel-perfect match at every width. Still much closer than no
         normalization at all. */
      .pod-submit-bar { min-height: 165px; }
      .captain-cards { grid-template-columns: 1fr; }
      /* Anchor the pod cluster near the top of its flex row instead of
         vertical-centering it — centering left a large empty gap above AND
         below the hub on tall phone screens. Pod slot/hub/gap sizing is NOT
         overridden here — those are the calc(literal * var(--hub-scale,1))
         rules above, and fitSquadHub() (JS) runs on mobile too, so the same
         auto-fit that fills desktop windows also sizes things here, capped
         by whichever of available width/height is tighter. */
      .draft-team-area { justify-content: flex-start; padding-top: 6px; }
      /* Mobile pod layout: a 3-column diamond — captain on the left,
         vertically between Pod A (above) and Pod C (below) in the middle
         column, Pod B on the right spanning/centered against that whole
         column. Four points (captain-left, A-top, C-bottom, B-right)
         instead of a flat stack, closer to the desktop radial shape's feel
         while staying narrow enough for a phone. `display:contents` on
         pod-row-bot lets its two children (Pod B, Pod C) land in different
         cells of this grid instead of being stuck sharing one. Divider/
         captain lines are skipped for this layout in updateConnectionLines()
         (see isMobileStack there) — the angle-based math they rely on
         doesn't mean anything for this shape; within-pod connector lines are
         unaffected since those are edge-to-edge between a pod's own slots
         regardless of layout. */
      .squad-hub-wrap {
        display: grid;
        grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto;
        justify-content: center;
        align-items: center;
        row-gap: 6px;
        column-gap: 6px;
        height: auto;
        padding: 6px 2px;
      }
      .pod-row-top, .pod-row-mid { position: static; transform: none; }
      .pod-row-mid { grid-column: 1; grid-row: 2; justify-self: center; } /* Captain: left, middle row */
      .pod-row-top { grid-column: 2; grid-row: 1; justify-self: center; } /* Pod A: middle column, top row */
      .pod-row-bot { display: contents; }
      .pod-row-bot .pod-group:nth-child(1) { grid-column: 3; grid-row: 1 / span 3; align-self: center; justify-self: center; position: static; top: auto; left: auto; } /* Pod B: right, spans all rows */
      .pod-row-bot .pod-group:nth-child(2) { grid-column: 2; grid-row: 3; justify-self: center; position: static; top: auto; left: auto; } /* Pod C: middle column, bottom row */
      /* Tighter internal pod gap than desktop, and a smaller captain hub
         than desktop's 66px — purely to reclaim width for a bigger
         --hub-scale. The 3-column diamond is more width-hungry than the
         previous 2-column version (an extra column for the captain), and
         this layout is width-bound, so every px shaved off gaps/the hub
         directly buys back rendered pod size. */
      .pod-slots { gap: calc(8px * var(--hub-scale, 1)); }
      .captain-hub-node { width: calc(46px * var(--hub-scale, 1)); height: calc(46px * var(--hub-scale, 1)); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="center-screen">
      <div class="spinner" style="width:36px;height:36px;border-width:3px;"></div>
      <p>Loading game data…</p>
    </div>
  </div>

  <script src="src/scoring-engine.js"></script>
  <script>
  // ─────────────────────────────────────────────────────────────────────────────
  // CONSTANTS
  // ─────────────────────────────────────────────────────────────────────────────
  const STORAGE_KEY     = 'fourballs_state_v9';
  const STORAGE_VERSION = 9;

  const TIER_COLORS = {
    platinum: '#c084fc', gold: '#c9a84c', silver: '#94a3b8',
    bronze: '#a0522d',   hero: '#5ec8e8'
  };

  // Index 1–12; hero always 5%, rest distributed
  const TIER_WEIGHTS = [
    null,
    { hero:5, platinum:80, gold:15, silver:0,  bronze:0  },
    { hero:5, platinum:80, gold:15, silver:0,  bronze:0  },
    { hero:5, platinum:15, gold:65, silver:15, bronze:0  },
    { hero:5, platinum:15, gold:65, silver:15, bronze:0  },
    { hero:5, platinum:5,  gold:40, silver:45, bronze:5  },
    { hero:5, platinum:5,  gold:40, silver:45, bronze:5  },
    { hero:5, platinum:0,  gold:15, silver:55, bronze:25 },
    { hero:5, platinum:0,  gold:15, silver:55, bronze:25 },
    { hero:5, platinum:0,  gold:0,  silver:25, bronze:70 },
    { hero:5, platinum:0,  gold:0,  silver:25, bronze:70 },
    { hero:5, platinum:0,  gold:0,  silver:5,  bronze:90 },
    { hero:5, platinum:0,  gold:0,  silver:5,  bronze:90 },
  ];

  // ─────────────────────────────────────────────────────────────────────────────
  // DATA
  // ─────────────────────────────────────────────────────────────────────────────
  let VENUES = [], CAPTAINS = [], PLAYERS = [];
  let CUP_RESULTS = {}, TALENT_SCORES = {};
  let CAPTAIN_IDS = new Set();
  function isCaptainCard(obj) { return !!obj && CAPTAIN_IDS.has(obj.id); }

  // ─────────────────────────────────────────────────────────────────────────────
  // STATE
  // ─────────────────────────────────────────────────────────────────────────────
  let G = null;

  function initState() {
    return {
      _version: STORAGE_VERSION,
      phase: 'landing',
      mode: 'standard',
      side: null,
      venue: null,
      picks: [],
      pairings: { fridayAM: [], fridayPM: [], saturdayAM: [], saturdayPM: [] },
      pairingOptions: [],   // pre-computed options sorted by chemistry (best first)
      pairingIndex:   0,    // which option is currently displayed (cycles 0-3 on reshuffle)
      captain: null,
      pods: [[null,null,null,null],[null,null,null,null],[null,null,null,null]],
      aiPicks: [],
      aiPairings: { fridayAM: [], fridayPM: [], saturdayAM: [], saturdayPM: [] },
      aiCaptain: null,
      seenNames:   [],
      aiSeenNames: [],
      currentRound: 1,
      currentCards: [],
      aiRoundPick:  null,
      lastPick:           null,  // last item the human picked this round (player or captain)
      lastPickIsCaptain:  false,
      awaitingNext:       false, // true between a pick and the user clicking "Next Selection"
      results: null
    };
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(G)); } catch(e) {}
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return (s && s._version === STORAGE_VERSION && s.phase) ? s : null;
    } catch(e) { return null; }
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PLAYER POOL — NO YEAR REQUIREMENT
  // ─────────────────────────────────────────────────────────────────────────────
  // heroProb: 5 = full chance, 1 = post-first-hero reduced, 0 = capped out.
  function rollTier(pickNum, heroProb = 5) {
    const w     = { ...TIER_WEIGHTS[pickNum], hero: heroProb };
    const total = Object.values(w).reduce((s, v) => s + v, 0);
    let r = Math.random() * total, cum = 0;
    for (const [tier, wt] of Object.entries(w)) {
      if (wt <= 0) continue;
      cum += wt;
      if (r < cum) return tier;
    }
    return 'bronze';
  }

  // Draw one player (and, while no captain is locked in yet, one captain) for a
  // given tier, falling back through tiers if pool is empty.
  // Fallback order prefers the nearest tier to avoid jarring platinum cards in round 12.
  function drawOneCard(nat, pickNum, usedNames, tierOverride, heroProb = 5, includeCaptains = false) {
    const tier = tierOverride || rollTier(pickNum, heroProb);
    const nearestFirst = {
      platinum: ['gold','silver','bronze','hero'],
      gold:     ['silver','platinum','bronze','hero'],
      silver:   ['bronze','gold','platinum','hero'],
      bronze:   ['silver','gold','platinum','hero'],
      hero:     ['silver','platinum','bronze'],   // gold tried below first
    };

    // Combined player+captain pool at a given tier. Captains never get added to the
    // permanent seenNames exclusion list (see generateAndTrackCards) since the captain
    // pool is small (4-9 per tier per side) and would exhaust well before round 13's
    // guaranteed-captain fallback if treated like the much larger player pool.
    function poolForTier(t) {
      let p = PLAYERS.filter(x => x.nationality === nat && x.tier === t && !usedNames.has(x.name));
      if (includeCaptains) {
        // Legendary-tier captains (Nicklaus, Jacklin) slot into the hero tier draw
        const capTiers = t === 'hero' ? ['hero', 'legendary'] : [t];
        p = p.concat(CAPTAINS.filter(c => c.nationality === nat && capTiers.includes(c.tier) && !usedNames.has(c.name)));
      }
      return p;
    }

    let pool = poolForTier(tier);

    if (!pool.length && tier === 'hero') {
      pool = poolForTier('gold');
    }
    if (!pool.length) {
      const order = (nearestFirst[tier] || ['bronze','silver','gold','platinum'])
        .filter(t => heroProb > 0 || t !== 'hero');
      for (const fb of order) {
        const fb2 = poolForTier(fb);
        if (fb2.length) { pool = fb2; break; }
      }
    }
    if (!pool.length) {
      pool = PLAYERS.filter(p => p.nationality === nat && !usedNames.has(p.name));
      if (includeCaptains) {
        pool = pool.concat(CAPTAINS.filter(c => c.nationality === nat && !usedNames.has(c.name)));
      }
    }
    if (!pool.length) return null;

    return pool[Math.floor(Math.random() * pool.length)];
  }

  // Each of the 3 cards rolls its own tier independently.
  // heroCount: heroes already picked by this side — 0→5%, 1→1%, ≥2→0%.
  // includeCaptains: while true, each tier-roll draws from players+captains combined
  // (see drawOneCard) — set to false once G.captain is locked in.
  function getCardsAnyYear(nat, pickNum, seenNames, heroCount = 0, includeCaptains = false) {
    const heroProb = heroCount === 0 ? 5 : heroCount === 1 ? 1 : 0;
    const usedNames = new Set(seenNames);
    const cards = [];
    for (let i = 0; i < 3; i++) {
      const card = drawOneCard(nat, pickNum, usedNames, null, heroProb, includeCaptains);
      if (card) {
        cards.push(card);
        usedNames.add(card.name);
      }
    }
    return cards;
  }

  function generateAndTrackCards(nat, pickNum, seenNames, heroCount = 0, includeCaptains = false) {
    const cards = getCardsAnyYear(nat, pickNum, seenNames, heroCount, includeCaptains);
    // Only players get permanently excluded from future rounds — see poolForTier note above.
    cards.forEach(c => { if (!isCaptainCard(c) && !seenNames.includes(c.name)) seenNames.push(c.name); });
    return cards;
  }

  // Both the human AND the AI draft 13 slots: 12 players + 1 captain that never
  // consumes a player slot. This one function generates a side-agnostic round of
  // cards for whichever side's turn it is — used for the human (G.side/G.picks/
  // G.captain/G.seenNames) and, identically, for the AI (opp(G.side)/G.aiPicks/
  // G.aiCaptain/G.aiSeenNames). Tier odds are keyed off how many *players* have
  // been picked so far, not the round number, so taking the captain early never
  // skips or repeats a tier-odds row.
  function generateRoundCardsFor(nat, picks, captain, seenNames) {
    if (picks.length === 12 && captain === null) {
      return drawLowTierCaptains(nat);
    }
    const pickNum   = Math.min(picks.length + 1, 12);
    const heroCount = picks.filter(p => p.tier === 'hero').length;
    return generateAndTrackCards(nat, pickNum, seenNames, heroCount, captain === null);
  }

  function nextRoundCards() {
    return generateRoundCardsFor(G.side, G.picks, G.captain, G.seenNames);
  }

  // Forced fallback once all 12 player slots are full and no captain has been taken
  // yet (round 13 for the human; the AI's equivalent last action if it never landed
  // on a captain along the way): exactly 3 low-tier (silver/bronze) captain options
  // only — guarantees a captain by draft's end, never costs a player slot, but
  // waiting costs you a weaker captain.
  function drawLowTierCaptains(nat) {
    let pool = CAPTAINS.filter(c => c.nationality === nat && (c.tier === 'silver' || c.tier === 'bronze'));
    if (pool.length < 3) pool = CAPTAINS.filter(c => c.nationality === nat); // safety net only
    const picked = [], used = new Set();
    while (picked.length < 3 && picked.length < pool.length) {
      const c = pool[Math.floor(Math.random() * pool.length)];
      if (!used.has(c.id)) { used.add(c.id); picked.push(c); }
    }
    return picked;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // AI LOGIC
  // ─────────────────────────────────────────────────────────────────────────────
  // Internal-only ranking for comparing captain cards against each other — never
  // shown to the user. Captains have no stat fields, so they can't go through
  // compositeScore like players do.
  const CAPTAIN_TIER_RANK = { legendary: 6, hero: 5, platinum: 4, gold: 3, silver: 2, bronze: 1 };
  function captainValue(c) {
    return (CAPTAIN_TIER_RANK[c.tier] || 0) * 100 + (c.chemistry_mult || 1) * 10 + (c.perks ? c.perks.length : 0);
  }

  function aiBestFromCards(cards, existingPicks = []) {
    if (!cards.length) return null;
    const players  = cards.filter(c => !isCaptainCard(c));
    const captains = cards.filter(c => isCaptainCard(c));

    // Forced captain-only round (mirrors the human's round-13 fallback) — just take
    // the best one on offer, no player comparison possible.
    if (!players.length) {
      return captains.reduce((best, c) => captainValue(c) > captainValue(best) ? c : best);
    }

    // Rule 1: always draft a hero player if one is available.
    const heroes = players.filter(p => p.tier === 'hero');
    if (heroes.length) {
      return heroes.reduce((best, p) =>
        compositeScore(p) > compositeScore(best) ? p : best
      );
    }

    // Rule 1.5: a hero/platinum-tier captain on offer is worth taking now rather than
    // gambling on the forced low-tier-only fallback later.
    if (captains.length) {
      const bestCaptain = captains.reduce((best, c) => captainValue(c) > captainValue(best) ? c : best);
      if (bestCaptain.tier === 'hero' || bestCaptain.tier === 'platinum') return bestCaptain;
    }

    // Rule 2: optimize for chemistry with existing picks (players only — captains
    // don't have player stats to run through computeChemistry).
    if (existingPicks.length > 0) {
      function chemPotential(candidate) {
        return existingPicks.reduce((sum, ep) => {
          return sum + computeChemistry(candidate, ep, PLAYERS, CUP_RESULTS);
        }, 0) / existingPicks.length;
      }
      return players.reduce((best, p) =>
        chemPotential(p) > chemPotential(best) ? p : best
      );
    }

    // Fallback (round 1): highest composite
    return players.reduce((best, p) =>
      compositeScore(p) > compositeScore(best) ? p : best
    );
  }

  // ── PAIRING ENGINE ─────────────────────────────────────────────────────────
  // Tier rules: Platinum max 4 team matches, Gold max 3, all others max 2.
  // 16 total team matches (8 foursomes + 8 fourball) × 2 players = 32 appearances.
  // No player paired with same partner twice within the same format.

  const TIER_MAX = { platinum: 4, gold: 3, silver: 2, bronze: 2, hero: 2 };
  function getTierMax(tier) { return TIER_MAX[tier] || 2; }

  // Step 2: assign total team appearances per player, summing to exactly 32.
  // If standard caps are short, relaxes tier limits in order:
  //   1. silver → 3, 2. bronze → 3, 3. gold → 4 (last resort).
  function _assignMatchCounts(picks) {
    const effMax = {};
    picks.forEach(p => { effMax[p.id] = getTierMax(p.tier); });

    const cap = () => picks.reduce((s, p) => s + effMax[p.id], 0);
    if (cap() < 32) picks.forEach(p => { if (p.tier === 'silver')                         effMax[p.id] = 3; });
    if (cap() < 32) picks.forEach(p => { if (p.tier === 'bronze')                         effMax[p.id] = 3; });
    if (cap() < 32) picks.forEach(p => { if (p.tier === 'gold')                           effMax[p.id] = 4; });
    if (cap() < 32) picks.forEach(p => { if (p.tier === 'hero' || p.tier === 'silver')    effMax[p.id] = 4; });

    const counts = {};
    picks.forEach(p => { counts[p.id] = Math.min(2, effMax[p.id]); });
    let need = 32 - picks.reduce((s, p) => s + counts[p.id], 0);

    const byMax = [...picks].sort((a, b) => effMax[b.id] - effMax[a.id]);
    for (const p of byMax) {
      if (need <= 0) break;
      const add = Math.min(effMax[p.id] - counts[p.id], need);
      counts[p.id] += add;
      need -= add;
    }
    return { counts, effMax };
  }

  // Split each player's count between foursomes (fs) and fourball (fb).
  // Extra match goes to the format where their format_fit is higher.
  // Balance loop corrects sums to exactly 16 each.
  function _splitFormatCounts(picks, matchCounts, effMax) {
    const fs = {}, fb = {};
    picks.forEach(p => {
      const tot  = matchCounts[p.id];
      const ffFS = (p.format_fit && p.format_fit.foursomes) || 75;
      const ffFB = (p.format_fit && p.format_fit.fourball)  || 75;
      const half = Math.floor(tot / 2);
      if (tot % 2 === 0) { fs[p.id] = half; fb[p.id] = half; }
      else if (ffFS >= ffFB) { fs[p.id] = half + 1; fb[p.id] = half; }
      else                    { fs[p.id] = half;     fb[p.id] = half + 1; }
    });

    // Balance to exactly 16 in each format
    let fsT = picks.reduce((s, p) => s + fs[p.id], 0);
    function shift(from, to, cond) {
      for (const p of picks) {
        if (fsT === 16) break;
        if (!cond(p)) continue;
        const ok = from[p.id] > 0 && to[p.id] < effMax[p.id];
        if (ok) { from[p.id]--; to[p.id]++; fsT += (from === fs ? -1 : 1); }
      }
    }
    if (fsT > 16) shift(fs, fb, p => fs[p.id] > fb[p.id]);
    if (fsT > 16) shift(fs, fb, () => true);
    if (fsT < 16) shift(fb, fs, p => fb[p.id] > fs[p.id]);
    if (fsT < 16) shift(fb, fs, () => true);

    return { fs, fb };
  }

  // All perfect matchings of an even-length player array (7!! = 105 for 8 players).
  function _perfectMatchings(players) {
    if (players.length === 0) return [[]];
    const first = players[0], rest = players.slice(1), results = [];
    for (let i = 0; i < rest.length; i++) {
      const partner   = rest[i];
      const remaining = rest.filter((_, j) => j !== i);
      for (const sub of _perfectMatchings(remaining)) {
        results.push([[first, partner], ...sub]);
      }
    }
    return results;
  }

  function _pairKey(p1, p2) { return [p1.id, p2.id].sort().join('|'); }

  // pods optional: if provided, same-pod pairs get a +5 bonus so the exhaustive
  // matching search naturally prefers podmate pairings over equally-strong cross-pod ones.
  function _scoreMatching(matching, format, pods) {
    return matching.reduce((s, [a, b]) => {
      if (!a || !b) return s;
      let score = computeChemistry(a, b, [], CUP_RESULTS);
      if (pods) {
        const pa = pods.findIndex(pod => pod.some(p => p && p.name === a.name));
        const pb = pods.findIndex(pod => pod.some(p => p && p.name === b.name));
        if (pa >= 0 && pa === pb) score += 5;
      }
      return s + score;
    }, 0);
  }

  // Generate 2 sessions for one format given per-player appearance counts.
  // optionSeed varies which "1-appearance" players go to session 1 vs session 2.
  function _generateFormatSessions(picks, countMap, format, optionSeed, pods) {
    const both = picks.filter(p => countMap[p.id] === 2);
    const once = picks.filter(p => countMap[p.id] === 1);

    // Deterministic but seed-varied shuffle of once-players
    const shuffled = [...once].sort((a, b) => {
      const ha = (a.id + optionSeed).split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 0);
      const hb = (b.id + optionSeed).split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 0);
      return ha - hb;
    });

    const need = 8 - both.length;
    const sess1 = [...both, ...shuffled.slice(0, need)];
    const sess2 = [...both, ...shuffled.slice(need)];

    // Best matching for session 1 (exhaustive over 105 options)
    const matchings1 = _perfectMatchings(sess1);
    const best1 = matchings1.reduce((b, m) =>
      _scoreMatching(m, format, pods) > _scoreMatching(b, format, pods) ? m : b, matchings1[0]);

    // Session 2: avoid repeating pairs from session 1 (first relaxation: allow cross-format repeats)
    const used = new Set(best1.map(([a, b]) => _pairKey(a, b)));
    const matchings2 = _perfectMatchings(sess2);
    const valid2  = matchings2.filter(m => m.every(([a, b]) => !used.has(_pairKey(a, b))));
    const pool2   = valid2.length ? valid2 : matchings2; // fallback: allow repeat if no valid option
    const best2   = pool2.reduce((b, m) =>
      _scoreMatching(m, format, pods) > _scoreMatching(b, format, pods) ? m : b, pool2[0]);

    return [best1, best2];
  }

  // Compute one complete pairing option using a given seed.
  // pods optional: passed to _scoreMatching to weight same-pod pairs higher.
  function _computeOneOption(picks, seed, pods) {
    const { counts, effMax } = _assignMatchCounts(picks);

    const { fs, fb } = _splitFormatCounts(picks, counts, effMax);
    const [fridayAM, saturdayAM] = _generateFormatSessions(picks, fs, 'foursomes', seed, pods);
    const [fridayPM, saturdayPM] = _generateFormatSessions(picks, fb, 'fourball',  seed, pods);

    // Track appearance counts to identify fatigued players (4 team matches)
    const appearances = {};
    for (const [p1, p2] of [...fridayAM, ...saturdayAM, ...fridayPM, ...saturdayPM]) {
      if (p1) appearances[p1.id] = (appearances[p1.id] || 0) + 1;
      if (p2) appearances[p2.id] = (appearances[p2.id] || 0) + 1;
    }
    const fatiguedIds = picks
      .filter(p => (appearances[p.id] || 0) >= 4)
      .map(p => p.id);

    const score = _scoreMatching(fridayAM,   'foursomes', pods) +
                  _scoreMatching(saturdayAM, 'foursomes', pods) +
                  _scoreMatching(fridayPM,   'fourball',  pods) +
                  _scoreMatching(saturdayPM, 'fourball',  pods);

    return { fridayAM, fridayPM, saturdayAM, saturdayPM, _score: score, _fatiguedIds: fatiguedIds };
  }

  // Compute up to N distinct options sorted by chemistry (best first).
  // pods optional (human team only): passed through to weight pod-mate pairings.
  // AI always passes pods=null (no pod screen).
  function computePairingOptions(picks, n = 4, pods = null) {
    const options = [], seen = new Set();
    for (let seed = 0; options.length < n && seed < n * 4; seed++) {
      const opt = _computeOneOption(picks, seed, pods);
      if (!opt) break;
      const fp = [...opt.fridayAM, ...opt.saturdayAM, ...opt.fridayPM, ...opt.saturdayPM]
        .map(([a, b]) => a && b ? _pairKey(a, b) : 'null').sort().join(',');
      if (!seen.has(fp)) { seen.add(fp); options.push(opt); }
    }
    options.sort((a, b) => b._score - a._score);
    return options.length ? options : [{ fridayAM: [], fridayPM: [], saturdayAM: [], saturdayPM: [], _score: 0, _fatiguedIds: [] }];
  }

  // Given user-picked AM pairs, find the best PM pairing from the same players (avoiding AM repeats).
  function _buildPMFromAMPairs(amPairs, format) {
    const players = amPairs.flat().filter(Boolean);
    if (players.length < 2) return amPairs;
    const usedKeys = new Set(amPairs.map(([a,b]) => a && b ? _pairKey(a,b) : null).filter(Boolean));
    const matchings = _perfectMatchings(players);
    const valid = matchings.filter(m => m.every(([a,b]) => !usedKeys.has(_pairKey(a,b))));
    const pool = valid.length ? valid : matchings;
    if (!pool.length) return amPairs;
    return pool.reduce((b, m) => _scoreMatching(m, format) > _scoreMatching(b, format) ? m : b, pool[0]);
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // HELPERS
  // ─────────────────────────────────────────────────────────────────────────────
  const opp = side => side === 'USA' ? 'EUR' : 'USA';

  function tcStyle(tier) { return `style="--tc:${TIER_COLORS[tier] || '#555'}"` ; }
  function tcClass(tier) { return `tc-${tier || 'bronze'}`; }
  function isHero(p)     { return p.tier === 'hero'; }
  function delay(ms)     { return new Promise(r => setTimeout(r, ms)); }
  function chemClass(s)  { return s >= 2 ? 'chem-strong' : s >= 1 ? 'chem-neutral' : 'chem-weak'; }
  function rClass(r)     { return r === 'win' ? 'r-win' : r === 'loss' ? 'r-loss' : 'r-half'; }

  function eraSat(year) {
    return Math.min(1, Math.max(0.45, 0.45 + (year - 1999) / 19 * 0.55)).toFixed(2);
  }

  // Shared Tabler icon path fragments (viewBox 0 0 24 24) — reused by the full-size
  // draft/review cards above and the pod-builder shield cards below.
  const SHIRT_PATH  = `<path d="M15 4l6 2v5h-3v8a1 1 0 0 1 -1 1h-10a1 1 0 0 1 -1 -1v-8h-3v-5l6 -2a3 3 0 0 0 6 0"/>`;

      <path d="M20 13h-3a1 1 0 0 0 -1 1v2a1 1 0 0 0 1 1h3"/>

  const JACKET_TRIM  = `<circle cx="12" cy="12" r="0.5" fill="#c9a84c" stroke="none"/>

  const FLAG_PATH    = `<path d="M5 14h14l-4.5 -4.5l4.5 -4.5h-14v16"/>`;
  const TROPHY_PATH  = `<path d="M8 21l8 0"/><path d="M12 17l0 4"/><path d="M7 4l10 0"/>
      <path d="M17 4v8a5 5 0 0 1 -10 0v-8"/>
      <path d="M5 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>

  function shirtIconHTML(p) {
    const stroke = TIER_COLORS[p.tier] || '#888';

  const ATTR_META = [

  // Course demand chips — same 4-attribute vocabulary as ATTR_META (power/accurate/shortgame/
  // clutch), so what's shown here is exactly what computePlayerChemScore's venue-match bonus
  // checks against. Chips shown are venueTopAttrs()'s top-2 (percentile rank across the venue
  // pool, not raw hidden_tags magnitude — see venueTopAttrs comment for why that matters).
  const DEMAND_COLOR = { power:'#f97316', accurate:'#38bdf8', shortgame:'#4ade80', clutch:'#f59e0b' };

  function courseProfileHTML(venue, captain) {
    if (!venue) return '';
    const topAttrs = venueTopAttrs(venue, VENUES, 2);
    const chips    = topAttrs.map(attrKey => {
      const attr = ATTR_META.find(a => a.key === attrKey);
      const svg  = attr ? attr.svg : '';
      const label = attr ? attr.label : attrKey;
      return `<span class="cpb-icon-chip" style="color:${DEMAND_COLOR[attrKey]}">${svg}${label}</span>`;
    }).join('');
    const capColor = captain ? ({ legendary:'#c9a84c', hero:'#c084fc', standard:'#22c55e' }[captain.prestige] || '#22c55e') : null;
    const capHTML  = captain ? `
      <div class="cpb-cap-mini" style="border-color:${capColor}">

  function playerCardHTML(p, clickable = true, extraClass = '', chemDotHTML = '') {
    const hero = isHero(p) ? 'hero-card' : '';

  // ─────────────────────────────────────────────────────────────────────────────
  // RENDER DISPATCH
  // ─────────────────────────────────────────────────────────────────────────────
  function render() {
    // Must run BEFORE the phase dispatch, not just after: if the help button
    // is currently nested inside #app (moved there by a previous call to
    // positionHelpBtn for the draft screen), the phase render below wipes
    // #app via innerHTML — which destroys any element still inside it,
    // button included. Pull it out to <body> first so it always survives.
    const helpBtn = document.getElementById('global-help-btn');
    if (helpBtn && helpBtn.parentElement !== document.body) document.body.appendChild(helpBtn);
    const p = G.phase;
    if      (p === 'landing')      renderLanding();
    else if (p === 'nationality')  renderNationality();
    else if (p === 'venue_spinner')renderVenueSpinner();
    else if (p === 'venue')        renderVenueReveal();
    else if (p === 'draft')        renderDraft();
    else if (p === 'review')       renderReview();
    else if (p === 'complete')     renderResults();
    else renderLanding();
    positionHelpBtn();
  }

  // Each screen's render() rebuilds #app from scratch via innerHTML, which
  // would destroy the persistent help button if it were ever moved inside
  // #app — so re-parent it fresh after every render instead of once at init.
  // On the draft screen it moves into squad-hub-area (freeing the fixed
  // bottom-right corner for the tray); everywhere else it's the normal fixed
  // button on <body>.
  function positionHelpBtn() {
    const btn = document.getElementById('global-help-btn');
    if (!btn) return;
    const hubArea = G.phase === 'draft' ? document.getElementById('squad-hub-area') : null;
    if (hubArea) {
      btn.classList.add('help-btn-inline');
      hubArea.appendChild(btn);
    } else {
      btn.classList.remove('help-btn-inline');
      document.body.appendChild(btn);
    }
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: LANDING
  // ─────────────────────────────────────────────────────────────────────────────
  function renderLanding() {
    const hasSave = !!loadSaved();
    document.getElementById('app').innerHTML = `
      <div class="landing-wrap fade-in">
        <div class="landing-logo">FOURBALLS</div>
        <div class="landing-rule"></div>

        ${hasSave ? `<div class="landing-continue"><a id="continue-btn">Continue saved game</a></div>` : ''}
      </div>`;

    document.getElementById('new-game-btn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      G = initState();
      G.phase = 'nationality';
      save();
      render();
    });

    document.getElementById('continue-btn')?.addEventListener('click', () => {
      const saved = loadSaved();

  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: VENUE SPINNER
  // ─────────────────────────────────────────────────────────────────────────────
  function renderVenueSpinner() {
    document.getElementById('app').innerHTML = `
      <div class="spinner-screen fade-in">
        <div class="spin-eyebrow">Drawing Your Venue</div>
        <div class="spin-reel" id="spin-reel">${VENUES[0].name}</div>
        <div class="spin-sub"  id="spin-sub">&nbsp;</div>
      </div>`;

    const reel = document.getElementById('spin-reel');
    const sub  = document.getElementById('spin-sub');
    let count = 0;
    const maxCount = 22;

    function tick() {
      count++;
      const v = VENUES[Math.floor(Math.random() * VENUES.length)];
      reel.textContent = v.name;
      sub.textContent  = v.display_name || '';

      if (count < maxCount) {
        const ms = 60 + Math.pow(count, 1.4) * 4;
        setTimeout(tick, ms);
      } else {
        setTimeout(() => {
          reel.textContent = G.venue.name;
          sub.textContent  = G.venue.display_name || '';
          reel.classList.add('landed');
          setTimeout(() => {
            G.phase = 'venue';
            save();
            render();
          }, 1400);
        }, 200);
      }
    }

    setTimeout(tick, 120);
  }
