  function renderCaptain() {
    const caps = G.captainCards;
    document.getElementById('app').innerHTML = `
      <div class="captain-screen fade-in">
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">Step 1 — Captain</div>
        <div class="captain-title">Choose Your Captain</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">Select the captain who will lead your ${G.side} team at ${G.venue.name}</div>
        <div class="captain-cards">
          ${caps.map(captainCardHTML).join('')}
        </div>
      </div>`;

    document.querySelectorAll('[data-cid]').forEach(el => {
      el.addEventListener('click', () => {
        G.captain = CAPTAINS.find(c => c.id === el.dataset.cid);
        G.aiCaptain = drawAICaptain(opp(G.side));
        G.phase = 'draft';
        G.currentRound = 1;
        G.seenNames   = [];
        G.aiSeenNames = [];
        G.picks       = [];
        G.aiPicks     = [];
        G.pairings       = { fridayAM: [], fridayPM: [], saturdayAM: [], saturdayPM: [] };
        G.pairingOptions = [];
        G.pairingIndex   = 0;
        G.currentCards = generateAndTrackCards(G.side, 1, G.seenNames, 0);
        save();
        render();
      });
    });
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: DRAFT
  // ─────────────────────────────────────────────────────────────────────────────
  function renderDraft() {
    const round = G.currentRound;
    const cards = G.currentCards;

    // 12-slot team board: filled picks + empty placeholders (always shown)
    const slotsHTML = Array.from({ length: 12 }, (_, i) =>
      i < G.picks.length
        ? playerPickedHTML(G.picks[i])
        : `<div class="pick-slot-empty"><span class="pse-num">${i + 1}</span></div>`
    ).join('');

    document.getElementById('app').innerHTML = `
      <div class="draft-full">
        <div class="page-header">
          <span class="page-title">Fourballs</span>
          <span class="ticker-score">Pick ${round} of 12</span>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:var(--text-dim)">${G.side}</span>
        </div>

        ${courseProfileHTML(G.venue, G.captain)}

        <div class="draft-team-area">
          <div style="padding:4px 12px 2px;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);">Your Squad — ${G.picks.length}/12</div>
          <div class="picks-grid">${slotsHTML}</div>
        </div>

        <div class="pick-area">
          <div class="pick-round-label">Round ${round} of 12 — Choose</div>
          <div class="pick-cards-row">
            ${cards.map(p => playerCardHTML(p, true)).join('')}
          </div>
        </div>
      </div>`;

    document.querySelectorAll('[data-pid]').forEach(el => {
      el.addEventListener('click', () => {
        const p = PLAYERS.find(x => x.id === el.dataset.pid);
        if (p) handlePickCard(p);
      });
    });
  }

  function handlePickCard(p) {
    G.picks.push(p);

    const aiHeroCount = G.aiPicks.filter(p => p.tier === 'hero').length;
    const aiCards = generateAndTrackCards(opp(G.side), G.currentRound, G.aiSeenNames, aiHeroCount);
    G.aiRoundCards = aiCards;
    const aiPick = aiBestFromCards(aiCards, G.aiPicks);
    G.aiRoundPick = aiPick;
    if (aiPick) G.aiPicks.push(aiPick);

    G.phase = 'ai_reveal';
    save();
    render();
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: AI REVEAL
  // ─────────────────────────────────────────────────────────────────────────────
  function renderAIReveal() {
    const round   = G.currentRound;
    const aiCards = G.aiRoundCards || [];
    const aiPick  = G.aiRoundPick;
    const myPick  = G.picks[G.picks.length - 1];
    const isLast  = round >= 12;

    const cardsHTML = aiCards.map(p => {
      const picked   = aiPick && p.id === aiPick.id;
      const wrapCls  = picked ? 'ai-picked' : 'ai-not-picked';
      const badge    = picked ? '<div class="ai-picked-badge">Opponent picked</div>' : '';
      return `<div class="ai-card-wrap ${wrapCls}">
        ${badge}
        ${playerCardHTML(p, false)}
      </div>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="ai-reveal-screen fade-in">
        <div class="ai-reveal-eyebrow">Round ${round} of 12</div>
        <div class="ai-reveal-title">Opponent's Pick — ${opp(G.side)}</div>
        <div class="ai-reveal-sub">Here's what they had to choose from</div>
        ${myPick ? `<div class="ai-your-pick">Your pick: <strong>${myPick.name}</strong> (${myPick.year})</div>` : ''}
        <button class="btn btn-gold" id="ai-continue-btn" style="margin:8px 0 4px;">
          ${isLast ? 'See Your Pairings →' : `Continue to Round ${round + 1} →`}
        </button>
        ${courseProfileHTML(G.venue, G.captain)}
        <div class="ai-reveal-cards">${cardsHTML || '<p style="color:var(--text-muted)">No options available</p>'}</div>
      </div>`;

    document.getElementById('ai-continue-btn').addEventListener('click', advanceFromAIReveal);
  }

  function advanceFromAIReveal() {
    const round = G.currentRound;
    if (round >= 12) {
      // Pre-compute 4 pairing options (best chemistry first); reshuffle cycles through them
      G.pairingOptions = computePairingOptions(G.picks, 4);
      G.pairingIndex   = 0;
      G.pairings       = G.pairingOptions[0];
      // AI always uses best option — no reshuffle
      const aiOpts = computePairingOptions(G.aiPicks, 1);
      G.aiPairings = aiOpts[0] || { fridayAM: [], fridayPM: [], saturdayAM: [], saturdayPM: [] };
      G.phase = 'review';
      save();
      render();
    } else {
      G.currentRound = round + 1;
      const userHeroCount = G.picks.filter(p => p.tier === 'hero').length;
      G.currentCards = generateAndTrackCards(G.side, G.currentRound, G.seenNames, userHeroCount);
      G.phase = 'draft';
      save();
      render();
    }
  }


  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: REVIEW
  // ─────────────────────────────────────────────────────────────────────────────
  function renderReview() {
    const app = document.getElementById('app');

    function pairListHTML(pairs, format) {
      if (!pairs || !pairs.length) return `<div style="font-size:11px;color:var(--text-dim);padding:4px 0;">No pairs assigned</div>`;
      return pairs.map((pair, i) => {
        const [p1, p2] = pair;
        if (!p1 && !p2) return `<div class="chem-pair" style="opacity:.4"><span class="cp-names">Pair ${i+1} — empty</span></div>`;
        if (p1 && p2) {
          const score = calculatePairingChemistry(p1, p2, format);
          return `<div class="chem-pair">
            <span class="chem-dot ${chemClass(score)}"></span>
            <span class="cp-names">${p1.name} + ${p2.name}</span>
            <span style="font-size:10px;color:var(--text-muted)">${score}%</span>
          </div>`;
        }
        const only = p1 || p2;
        return `<div class="chem-pair"><span class="cp-names">${only ? only.name : '—'} + (incomplete)</span></div>`;
      }).join('');
    }

    function teamColHTML(pairings, captain, title) {
      return `<div class="review-col-title">${title}</div>
        ${captain ? `<div class="captain-summary" style="margin-bottom:12px;">
          <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Captain</div>
          <div style="font-weight:700">${captain.name}</div>
          <div style="font-size:11px;color:var(--text-muted)">${(captain.years || []).join(', ')}</div>
        </div>` : ''}
        <div class="review-slot-group">
          <div class="review-slot-label">Friday AM — Foursomes</div>
          ${pairListHTML(pairings.fridayAM, 'foursomes')}
        </div>
        <div class="review-slot-group">
          <div class="review-slot-label">Friday PM — Fourball</div>
          ${pairListHTML(pairings.fridayPM, 'fourball')}
        </div>
        <div class="review-slot-group">
          <div class="review-slot-label">Saturday AM — Foursomes</div>
          ${pairListHTML(pairings.saturdayAM, 'foursomes')}
        </div>
        <div class="review-slot-group">
          <div class="review-slot-label">Saturday PM — Fourball</div>
          ${pairListHTML(pairings.saturdayPM, 'fourball')}
        </div>`;
    }

    // Fatigued players (platinum with 4 team appearances) + capacity error handling
    const fatiguedIds   = new Set(G.pairings._fatiguedIds || []);
    const fatiguedNames = G.picks.filter(p => fatiguedIds.has(p.id)).map(p => p.name);
    const optCount      = (G.pairingOptions || []).length;
    const optLabel      = optCount > 1 ? `Option ${(G.pairingIndex || 0) + 1} of ${optCount}` : '';
    const hasCapErr     = !G.pairings.fridayAM || G.pairings.fridayAM.length === 0;

    const fatigueWarning = fatiguedNames.length ? `
      <div style="padding:6px 14px;background:rgba(201,168,76,.08);border-bottom:1px solid rgba(201,168,76,.2);font-size:11px;">
        <span style="color:var(--gold);font-weight:700;">⚠ Fatigue: </span>
        <span style="color:var(--text-muted)">${fatiguedNames.map(n => `${n} plays all 4 team sessions and enters Sunday fatigued.`).join(' ')}</span>
      </div>` : '';

    const capError = hasCapErr ? `
      <div style="padding:10px 14px;background:rgba(229,57,53,.1);border-bottom:1px solid rgba(229,57,53,.3);font-size:12px;color:#ef9a9a;">
        ⚠ Roster lacks the tier depth to fill all 16 team match slots. Consider reshuffling or accepting a lighter schedule.
      </div>` : '';

    app.innerHTML = `
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <div class="page-header">
          <span class="page-title">Fourballs</span>
          <span style="flex:1"></span>
          <span style="font-size:12px;color:var(--text-muted)">${G.venue.name}</span>
        </div>
        <div style="padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-gold" id="sim-btn" style="font-size:15px;padding:10px 22px;">Simulate The Cup →</button>
          <div style="display:flex;align-items:center;gap:8px;">
            ${optLabel ? `<span style="font-size:10px;color:var(--text-dim)">${optLabel}</span>` : ''}
            <button class="btn btn-outline" id="rerandom-btn" style="font-size:12px;padding:6px 14px;">Reshuffle Pairings</button>
          </div>
        </div>
        ${capError}
        ${fatigueWarning}
        <div class="review-layout">
          <div class="review-col">${teamColHTML(G.pairings, G.captain, 'Your Team (' + G.side + ')')}</div>
          <div class="review-col">${teamColHTML(G.aiPairings, G.aiCaptain, 'Opponent (' + opp(G.side) + ')')}</div>
        </div>
      </div>`;

    document.getElementById('rerandom-btn').addEventListener('click', () => {
      const opts = G.pairingOptions || [];
      if (opts.length > 1) {
        G.pairingIndex = ((G.pairingIndex || 0) + 1) % opts.length;
        G.pairings = opts[G.pairingIndex];
      }
      save();
      renderReview();
    });

    document.getElementById('sim-btn').addEventListener('click', () => {
      try {
        const myTeam = {
          fridayAMPairs:   G.pairings.fridayAM,
          fridayPMPairs:   G.pairings.fridayPM,
          saturdayAMPairs: G.pairings.saturdayAM,
          saturdayPMPairs: G.pairings.saturdayPM,
          allPlayers:      G.picks
        };
        const aiTeam = {
          fridayAMPairs:   G.aiPairings.fridayAM,
          fridayPMPairs:   G.aiPairings.fridayPM,
          saturdayAMPairs: G.aiPairings.saturdayAM,
          saturdayPMPairs: G.aiPairings.saturdayPM,
          allPlayers:      G.aiPicks
        };
        G.results = simulateFullEvent(myTeam, aiTeam, G.venue, G.captain, G.aiCaptain);
        G.phase = 'complete';
        save();
        renderResults();
      } catch(e) {
        console.error('Simulate error:', e);
        alert('Simulation error: ' + e.message + '\n\nCheck the browser console for details.');
      }
    });
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // SCREEN: RESULTS
  // ─────────────────────────────────────────────────────────────────────────────
  function renderResults() {
    const oppSide = opp(G.side);
    document.getElementById('app').innerHTML = `
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <div class="page-header">
          <span class="page-title">Fourballs</span>
          <span class="ticker-score" id="live-score">${G.side} 0 — ${oppSide} 0</span>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:var(--text-dim)">${G.venue.name}</span>
        </div>
        <div class="results-layout">
          <div class="results-feed" id="rbody"></div>
          <div class="results-sidebar">
            <div class="score-panel">
              <div class="sp-total-label">Total Score</div>
              <div class="sp-total-score" id="sp-total">0 — 0</div>
              <div class="sp-team-names"><span>${G.side}</span><span>${oppSide}</span></div>
              <div class="sp-divider"></div>
              <div class="sp-sess-label">Session</div>
              <div class="sp-sess-name" id="sp-sess-name">—</div>
              <div class="sp-sess-score" id="sp-sess-score">— — —</div>
            </div>
          </div>
        </div>
      </div>`;

    doReveal(G.results);
  }

  async function doReveal(r) {
    const body = document.getElementById('rbody');
    let uPts = 0, aPts = 0;
    let rowIdx = 0;
    let sessU = 0, sessA = 0;

    function updatePanel() {
      const oppSide = opp(G.side);
      const ticker  = document.getElementById('live-score');
      if (ticker) ticker.textContent = `${G.side} ${uPts} — ${oppSide} ${aPts}`;
      const spTotal = document.getElementById('sp-total');
      if (spTotal) spTotal.textContent = `${uPts} — ${aPts}`;
      const spSessScore = document.getElementById('sp-sess-score');
      if (spSessScore) spSessScore.textContent = `${sessU} — ${sessA}`;
    }

    function startSession(name) {
      sessU = 0; sessA = 0;
      const el = document.getElementById('sp-sess-name');
      if (el) el.textContent = name;
      updatePanel();
    }

    function addAndTick(result) {
      if (result === 'win')        { uPts += 1;   sessU += 1; }
      else if (result === 'halve') { uPts += .5;  aPts += .5; sessU += .5; sessA += .5; }
      else                         { aPts += 1;   sessA += 1; }
      updatePanel();
    }

    // Prepend a new session block — newest content always on top
    function prependBlock(html) {
      body.insertAdjacentHTML('afterbegin', html);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function revealMatches(containerId, matches, msDelay) {
      const cont = document.getElementById(containerId);
      for (const m of matches) {
        await delay(msDelay);
        addAndTick(m.result);
        const id = 'row-' + (++rowIdx);
        cont.insertAdjacentHTML('afterbegin', `
          <div class="match-row" id="${id}">
            <div class="match-players">${m.myPlayers.filter(Boolean).join(' &amp; ')} <span style="color:var(--text-dim)">vs</span> ${m.oppPlayers.filter(Boolean).join(' &amp; ')}</div>
            <div class="match-result ${rClass(m.result)}">${rLabel(m.result)}</div>
            <div class="match-pts">+${m.points}</div>
          </div>`);
        await delay(40);
        document.getElementById(id)?.classList.add('revealed');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function showBadge(id) {
      const el = document.getElementById(id);
      if (el) { el.textContent = `${sessU} — ${sessA}`; el.classList.add('visible'); }
    }

    // ── FRIDAY FOURSOMES AM ──
    startSession('Friday AM');
    prependBlock(`<div class="session-block">
      <div class="session-head-row">
        <span class="session-header">Friday — Foursomes</span>
        <span class="session-score-badge" id="sbadge-fri-am"></span>
      </div>
      <div class="sub-header">Morning Session</div>
      <div id="sec-fri-am"></div>
    </div>`);
    await revealMatches('sec-fri-am', r.sessions.fridayAM, 1500);
    showBadge('sbadge-fri-am');
    await delay(900);

    // ── FRIDAY FOURBALL PM ──
    startSession('Friday PM');
    prependBlock(`<div class="session-block">
      <div class="session-head-row">
        <span class="session-header">Friday — Fourball</span>
        <span class="session-score-badge" id="sbadge-fri-pm"></span>
      </div>
      <div class="sub-header">Afternoon Session</div>
      <div id="sec-fri-pm"></div>
      <div id="sum-fri-pm" class="session-summary" style="display:none"></div>
    </div>`);
    await revealMatches('sec-fri-pm', r.sessions.fridayPM, 1500);
    showBadge('sbadge-fri-pm');
    const el1 = document.getElementById('sum-fri-pm');
    if (el1) { el1.textContent = `After Friday: ${G.side} ${uPts} — ${opp(G.side)} ${aPts}`; el1.style.display = ''; el1.style.color = 'var(--gold)'; }
    await delay(1200);

    // ── SATURDAY FOURSOMES AM ──
    startSession('Saturday AM');
    prependBlock(`<div class="session-block">
      <div class="session-head-row">
        <span class="session-header">Saturday — Foursomes</span>
        <span class="session-score-badge" id="sbadge-sat-am"></span>
      </div>
      <div class="sub-header">Morning Session</div>
      <div id="sec-sat-am"></div>
    </div>`);
    await revealMatches('sec-sat-am', r.sessions.saturdayAM, 1500);
    showBadge('sbadge-sat-am');
    await delay(900);

    // ── SATURDAY FOURBALL PM ──
    startSession('Saturday PM');
    prependBlock(`<div class="session-block">
      <div class="session-head-row">
        <span class="session-header">Saturday — Fourball</span>
        <span class="session-score-badge" id="sbadge-sat-pm"></span>
      </div>
      <div class="sub-header">Afternoon Session</div>
      <div id="sec-sat-pm"></div>
      <div id="sum-sat-pm" class="session-summary" style="display:none"></div>
    </div>`);
    await revealMatches('sec-sat-pm', r.sessions.saturdayPM, 1500);
    showBadge('sbadge-sat-pm');
    const el2 = document.getElementById('sum-sat-pm');
    if (el2) { el2.textContent = `After Saturday: ${G.side} ${uPts} — ${opp(G.side)} ${aPts}`; el2.style.display = ''; el2.style.color = 'var(--gold)'; }
    await delay(1200);

    // ── SUNDAY SINGLES ──
    startSession('Sunday Singles');
    prependBlock(`<div class="session-block">
      <div class="session-head-row">
        <span class="session-header">Sunday — Singles</span>
        <span class="session-score-badge" id="sbadge-sun"></span>
      </div>
      <div id="sec-sun"></div>
    </div>`);
    await delay(800);

    for (let i = 0; i < r.sessions.sunday.length; i++) {
      const m          = r.sessions.sunday[i];
      const cupDecided = uPts > 14 || aPts > 14;
      const msDelay    = cupDecided ? 700 : 2000;
      const isClose    = !cupDecided && i >= 9 && ((14.5 - uPts) <= 1.5 || (14.5 - aPts) <= 1.5);

      if (isClose) {
        const dp = document.createElement('div');
        dp.className = 'dramatic-pause'; dp.id = 'dp';
        dp.textContent = `Match ${i + 1} — Everything on the line…`;
        document.getElementById('sec-sun').prepend(dp);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        await delay(2800);
        document.getElementById('dp')?.remove();
      } else {
        await delay(msDelay);
      }

      addAndTick(m.result);
      const id = 'row-' + (++rowIdx);
      const fatiguedTag     = '<span style="font-size:10px;color:var(--halve);opacity:.7">(fatigued)</span>';
      const fatiguedNote    = m.fatigued    ? ' ' + fatiguedTag : '';
      const oppFatiguedNote = m.oppFatigued ? ' ' + fatiguedTag : '';
      document.getElementById('sec-sun').insertAdjacentHTML('afterbegin', `
        <div class="match-row" id="${id}">
          <span class="match-num">${i + 1}.</span>
          <div class="match-players">${m.myPlayers[0]}${fatiguedNote} <span style="color:var(--text-dim)">vs</span> ${m.oppPlayers[0]}${oppFatiguedNote}</div>
          <div class="match-result ${rClass(m.result)}">${rLabel(m.result)}</div>
        </div>`);
      await delay(40);
      document.getElementById(id)?.classList.add('revealed');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    showBadge('sbadge-sun');
    await delay(1000);
    showFinalBanner(r, uPts, aPts);
  }

  function showFinalBanner(r, uPts, aPts) {
    const body    = document.getElementById('rbody');
    const oppSide = opp(G.side);
    const w       = r.winner;

    let bClass, bTitle, bSub;
    if (w === 'user') {
      bClass = 'banner-win';  bTitle = 'The Cup is Yours!';
      bSub   = `${G.side} wins ${r.finalScore.user}–${r.finalScore.ai}`;
    } else if (w === 'ai') {
      bClass = 'banner-loss'; bTitle = 'Defeated';
      bSub   = `${oppSide} wins ${r.finalScore.ai}–${r.finalScore.user}`;
    } else {
      bClass = 'banner-tie';  bTitle = 'The Cup is Shared';
      bSub   = `${r.finalScore.user}–${r.finalScore.ai} — Holders retain the Ryder Cup`;
    }

    const allMy  = G.picks.filter(Boolean);
    const allAI  = G.aiPicks.filter(Boolean);
    const bestMy = allMy.reduce((b, p) => compositeScore(p) > compositeScore(b) ? p : b, allMy[0]);
    const bestAI = allAI.reduce((b, p) => compositeScore(p) > compositeScore(b) ? p : b, allAI[0]);

    const sessions = [r.sessions.fridayAM, r.sessions.fridayPM, r.sessions.saturdayAM, r.sessions.saturdayPM];
    const sessWins = sessions.filter(s => s.filter(m=>m.result==='win').length > s.filter(m=>m.result==='loss').length).length;
    const summary  = w === 'user'
      ? `Won ${sessWins} of 4 team sessions at ${G.venue.name}`
      : w === 'ai'
      ? `Hard fought at ${G.venue.name} — fell short on the day`
      : `A dramatic tie at ${G.venue.name} — the Cup is shared`;

    const shareText = `${G.side} ${r.finalScore.user} — ${oppSide} ${r.finalScore.ai} | ${G.venue.name} | Captain: ${G.captain?.name} | MVP: ${bestMy?.name} | ${summary} #Fourballs`;

    body.insertAdjacentHTML('afterbegin', `
      <div class="result-banner ${bClass} fade-in">
        <div class="banner-title">${bTitle}</div>
        <div class="banner-sub">${bSub}</div>
      </div>
      <div class="share-card fade-in">
        <h3>Match Summary</h3>
        <p><strong>Final Score:</strong> ${G.side} ${r.finalScore.user} — ${oppSide} ${r.finalScore.ai}</p>
        <p><strong>Venue:</strong> ${G.venue.name}</p>
        <p><strong>Your Captain:</strong> ${G.captain?.name || '—'}</p>
        <p><strong>Your Star:</strong> ${bestMy?.name} (${bestMy?.year})</p>
        <p><strong>Their Star:</strong> ${bestAI?.name} (${bestAI?.year})</p>
        <p style="color:var(--text-muted);font-style:italic;margin-top:6px">${summary}</p>
        <div class="share-btns">
          <button class="btn btn-outline" id="copy-btn">Copy Result</button>
          <button class="btn btn-outline" id="share-btn" style="display:none">Share</button>
          <button class="btn btn-red" id="newgame-btn">New Game</button>
        </div>
      </div>`);

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(shareText)
        .then(() => { document.getElementById('copy-btn').textContent = 'Copied!'; })
        .catch(() => { prompt('Copy this:', shareText); });
    });

    if (navigator.share) {
      const sb = document.getElementById('share-btn');
      sb.style.display = '';
      sb.addEventListener('click', () => navigator.share({ title: 'Fourballs', text: shareText }).catch(()=>{}));
    }

    document.getElementById('newgame-btn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      G = initState();
      save();
      render();
    });
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // TUTORIAL
  // ─────────────────────────────────────────────────────────────────────────────
  const TUTORIAL_STEPS = [
    {
      title: 'Pick Your Side',
      body: 'Choose USA or Europe. Your opponent AI drafts simultaneously from the other side and builds their own squad.'
    },
    {
      title: 'Venue Reveal',
      body: 'Your venue is drawn randomly before the draft. The course profile bar shows what it demands — build your team to match it.'
    },
    {
      title: 'Captain First',
      body: 'Pick your captain before you know who you\'ll draft. Their bonus applies all week, and some captains have special affinity with certain players — choose wisely.'
    },
    {
      title: 'Draft Cards',
      body: '3 players from across all Ryder Cup years appear each round. Earlier picks lean elite, later picks are more of a gamble — but a Hero card can land any round.'
    },
    {
      title: 'Pairings',
      body: 'After round 12, pairings are auto-assigned by chemistry and strength. Hit Re-randomize on the review screen to explore different matchups until you find a lineup you trust.'
    },
    {
      title: 'Simulate',
      body: 'Lock in your lineup and simulate the full Ryder Cup. Friday, Saturday, then Sunday singles — one match at a time. Running score updates after every session.'
    },
    {
      title: 'Tap ? anytime',
      body: 'The ? button in the bottom-right shows this tutorial again plus the full tier probability table so you always know your odds.'
    }
  ];

  let _tutStep = 0;

  function showTutorial(startStep = 0) {
    _tutStep = startStep;
    _renderTutorial();
  }

  function _renderTutorial() {
    document.getElementById('tutorial-overlay')?.remove();
    const step   = TUTORIAL_STEPS[_tutStep];
    const total  = TUTORIAL_STEPS.length;
    const isLast = _tutStep === total - 1;
    const dots   = TUTORIAL_STEPS.map((_, i) =>
      `<div class="tut-dot${i === _tutStep ? ' active' : ''}"></div>`
    ).join('');

    const div = document.createElement('div');
    div.className = 'tutorial-overlay';
    div.id = 'tutorial-overlay';
    div.innerHTML = `
      <div class="tutorial-card">
        <div class="tut-eyebrow">Step ${_tutStep + 1} of ${total}</div>
        <div class="tut-title">${step.title}</div>
        <div class="tut-body">${step.body}</div>
        <div class="tut-dots">${dots}</div>
        <div class="tut-actions">
          <button class="btn btn-outline" id="tut-skip">Skip</button>
          <button class="btn btn-gold" id="tut-next">${isLast ? 'Done ✓' : 'Next →'}</button>
        </div>
      </div>`;
    document.body.appendChild(div);

    document.getElementById('tut-skip').addEventListener('click', closeTutorial);
    document.getElementById('tut-next').addEventListener('click', () => {
      if (isLast) closeTutorial();
      else { _tutStep++; _renderTutorial(); }
    });
  }

  function closeTutorial() {
    document.getElementById('tutorial-overlay')?.remove();
    localStorage.setItem('tutorial_seen', '1');
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // HELP MODAL
  // ─────────────────────────────────────────────────────────────────────────────
  function showHelpModal() {
    document.getElementById('help-modal-overlay')?.remove();
    const tierRows = [
      ['1–2',   '80%', '15%', '0%',  '0%',  '5%'],
      ['3–4',   '15%', '65%', '15%', '0%',  '5%'],
      ['5–6',   '5%',  '40%', '45%', '5%',  '5%'],
      ['7–8',   '0%',  '15%', '55%', '25%', '5%'],
      ['9–10',  '0%',  '0%',  '25%', '70%', '5%'],
      ['11–12', '0%',  '0%',  '5%',  '90%', '5%'],
    ];
    const tableRows = tierRows.map(([pick, pl, go, si, br, he]) => `
      <tr>
        <td>Pick ${pick}</td>
        <td style="color:#c084fc">${pl}</td>
        <td style="color:#c9a84c">${go}</td>
        <td style="color:#94a3b8">${si}</td>
        <td style="color:#a0522d">${br}</td>
        <td style="color:#38bdf8">${he}</td>
      </tr>`).join('');

    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.id = 'help-modal-overlay';
    div.innerHTML = `
      <div class="help-modal">
        <div class="help-modal-hdr">
          <div class="help-modal-title">Fourballs — Help</div>
          <button class="help-modal-close" id="help-close">×</button>
        </div>

        <div class="help-section-title">Tier Odds Per Pick</div>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Hero probability drops to 1% after your first hero, 0% after two.</p>
        <table class="tier-table">
          <thead>
            <tr>
              <th>Pick</th>
              <th style="color:#c084fc">Platinum</th>
              <th style="color:#c9a84c">Gold</th>
              <th style="color:#94a3b8">Silver</th>
              <th style="color:#a0522d">Bronze</th>
              <th style="color:#38bdf8">Hero</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>

        <div class="help-section-title">How to Play</div>
        <ul class="how-to-list">
          <li><strong>Captain first</strong> — pick before the draft; their bonus applies all week</li>
          <li><strong>12 rounds</strong> — 3 players from any Ryder Cup year appear per round</li>
          <li><strong>Earlier = better</strong> — picks 1–4 lean Platinum/Gold; picks 9–12 lean Bronze</li>
          <li><strong>Hero cards</strong> — can appear any round; special abilities shown on the card</li>
          <li><strong>Auto-pairings</strong> — assigned after round 12; Re-randomize to try new matchups</li>
          <li><strong>Fatigue</strong> — players in both Foursomes and Fourball pairs get a singles penalty</li>
          <li><strong>28 points total</strong> — first to 14.5 wins the Ryder Cup</li>
        </ul>

        <div style="margin-top:18px;display:flex;gap:10px;">
          <button class="btn btn-outline" id="help-show-tutorial" style="font-size:13px;padding:8px 16px;">Show Tutorial</button>
          <button class="btn btn-outline" id="help-close-btn" style="font-size:13px;padding:8px 16px;flex:1">Close</button>
        </div>
      </div>`;
    document.body.appendChild(div);

    document.getElementById('help-close').addEventListener('click', closeHelpModal);
    document.getElementById('help-close-btn').addEventListener('click', closeHelpModal);
    document.getElementById('help-show-tutorial').addEventListener('click', () => {
      closeHelpModal();
      showTutorial(0);
    });
    div.addEventListener('click', e => { if (e.target === div) closeHelpModal(); });
  }

  function closeHelpModal() {
    document.getElementById('help-modal-overlay')?.remove();
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const [venues, captains, players] = await Promise.all([
        fetch('data/venues.json').then(r => r.json()),
        fetch('data/captains.json').then(r => r.json()),
        fetch('data/players.json').then(r => r.json()),
      ]);
      VENUES   = venues;
      CAPTAINS = captains;
      PLAYERS  = players;
    } catch(err) {
      document.getElementById('app').innerHTML = `
        <div class="center-screen">
          <h2>Open with a local web server</h2>
          <p>This game loads data files that require a local server — it cannot run directly from the filesystem.</p>
          <p style="margin-top:10px;">In VS Code, right-click <code>index.html</code> → <strong>Open with Live Server</strong>.</p>
          <p style="margin-top:6px;">Or run: <code>npx serve .</code> in this folder.</p>
          <p style="margin-top:10px;font-size:12px;color:var(--text-dim)">${err.message}</p>
        </div>`;
      return;
    }

    // Inject persistent help button
    const helpBtn = document.createElement('button');
    helpBtn.className = 'help-btn';
    helpBtn.id = 'global-help-btn';
    helpBtn.textContent = '?';
    helpBtn.title = 'Help & Tier Odds';
    helpBtn.addEventListener('click', showHelpModal);
    document.body.appendChild(helpBtn);

    const saved = loadSaved();
    if (saved && saved.phase !== 'landing') {
      G = saved;
    } else {
      G = initState();
      save();
    }

    render();

    // Show tutorial on first visit, after the screen renders
    if (!localStorage.getItem('tutorial_seen')) {
      setTimeout(() => showTutorial(0), 600);
    }
  }

  init();
  </script>
</body>
</html>
